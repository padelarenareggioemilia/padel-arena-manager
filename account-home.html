<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICS Padel Championship · Accesso account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8fc;font-family:system-ui;color:#0a2e5e}
.card{width:min(540px,calc(100% - 28px));background:#fff;border:1px solid #b9cde3;border-radius:20px;padding:20px;text-align:center}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#164a95;color:#fff}.secondary{background:#fff;color:#164a95;border:1px solid #164a95}.notice{padding:11px;border:1px solid #b9cde3;border-radius:11px;background:#edf4fb;margin:10px 0}
</style></head><body><main class="card"><img src="assets/aics-logo.png" style="width:110px;height:75px;object-fit:contain"><h1>AICS PADEL CHAMPIONSHIP</h1><div id="msg" class="notice">Controllo account…</div><button class="btn secondary" onclick="changeAccount()">Cambia account</button></main>
<script>
const cfg=window.PAM_V9_CONFIG,s=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),msg=document.getElementById('msg');

async function destinationForUser(user){
  const userId=user.id;
  const email=(user.email||'').trim().toLowerCase();

  const p=await s.from('profiles').select('role').eq('id',userId).maybeSingle();
  if(p.error)throw p.error;
  if(p.data?.role==='admin')return 'index.html';

  const roles=await s.from('team_user_roles')
    .select('role,team_id,active')
    .eq('user_id',userId)
    .eq('active',true);
  if(roles.error)throw roles.error;

  const operational=(roles.data||[]).find(x=>['captain','secretary'].includes(x.role));
  if(operational)return `captain.html?team=${encodeURIComponent(operational.team_id)}`;

  const playerRole=(roles.data||[]).find(x=>x.role==='player');
  if(playerRole)return `player.html?team=${encodeURIComponent(playerRole.team_id)}`;

  if(email){
    const captainTeam=await s.from('teams')
      .select('id')
      .ilike('captain_email',email)
      .limit(1)
      .maybeSingle();
    if(!captainTeam.error && captainTeam.data?.id){
      return `captain.html?team=${encodeURIComponent(captainTeam.data.id)}`;
    }

    const roster=await s.from('roster_requests')
      .select('team_id,status')
      .ilike('email',email)
      .eq('status','approved')
      .limit(1)
      .maybeSingle();
    if(!roster.error && roster.data?.team_id){
      return `player.html?team=${encodeURIComponent(roster.data.team_id)}`;
    }
  }

  return 'public.html';
}

async function init(){
 const current=await s.auth.getSession();
 if(!current.data.session){location.replace('login.html?change=1');return}
 try{
   const destination=await destinationForUser(current.data.session.user);
   msg.textContent='Accesso riconosciuto. Apertura area personale…';
   location.replace(destination);
 }catch(e){msg.textContent=e.message||String(e)}
}
async function changeAccount(){
 await s.auth.signOut({scope:'local'});
 localStorage.clear();sessionStorage.clear();
 location.replace('login.html?change=1&v=121');
}
window.changeAccount=changeAccount;init();
</script></body></html>

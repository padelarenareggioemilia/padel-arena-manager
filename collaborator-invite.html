<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Accesso collaboratore · Padel Arena</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#06101d;--card:#10233b;--line:#315174;--text:#f8fafc;--muted:#adc0d3;--lime:#9dff25;--red:#ff5364}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#164967,transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:16px 14px 60px}.brand{display:flex;gap:13px;align-items:center;margin:8px 0 18px}.brand img{width:72px;height:72px;border-radius:19px;object-fit:cover}.brand h1{margin:0}.muted{color:var(--muted)}.card{background:#10233bf2;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.notice{border:1px solid var(--line);border-radius:14px;padding:13px;background:#08192b;margin:10px 0}.success{border-color:#4ade80;background:#0b2b21}.error{border-color:var(--red);background:#35131a}label{display:block;font-size:13px;font-weight:900;margin:10px 0 5px}input,button{font:inherit}input{width:100%;padding:13px;border:1px solid #406489;border-radius:12px;background:#071523;color:#fff}button{display:block;width:100%;padding:14px;border:0;border-radius:13px;background:var(--lime);color:#07111f;text-align:center;font-weight:950;margin-top:12px}.secondary{background:#183856;color:#fff;border:1px solid #41678c}.hidden{display:none!important}</style></head><body><main><div class="brand"><img src="assets/padel-arena-manager-logo.png" alt=""><div><h1>Padel Arena Manager</h1><div class="muted">ACCESSO COLLABORATORE</div></div></div><div id="app"><div class="card">Verifica dell’invito…</div></div></main><script>
const URL_SB="https://zxubwvtngyfebtfnvnwg.supabase.co",KEY_SB="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";
const sb=supabase.createClient(URL_SB,KEY_SB,{auth:{persistSession:true,detectSessionInUrl:true}}),token=new URLSearchParams(location.search).get("invite")||localStorage.getItem("pam_collaborator_invite")||"";let invite=null;
const esc=v=>String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
function itError(e){const m=String(e?.message||e||"Errore sconosciuto");if(/invalid login credentials/i.test(m))return "Email o password non corrette.";if(/email not confirmed/i.test(m))return "Devi prima confermare il tuo indirizzo email.";if(/already registered/i.test(m))return "Esiste già un account con questa email. Usa la sezione ‘Ho già un account’.";if(/rate limit|too many requests/i.test(m))return "Troppi tentativi. Attendi qualche minuto e riprova.";return m}
function show(t,bad){const x=document.getElementById("msg");if(x){x.className="notice "+(bad?"error":"success");x.textContent=t}}
async function load(){if(!token)return fail("Link di invito mancante.");localStorage.setItem("pam_collaborator_invite",token);const r=await sb.rpc("public_collaborator_invite",{p_token:token});if(r.error||!r.data)return fail(r.error?.message||"Invito non valido o non più attivo.");invite=r.data;render();const s=await sb.auth.getSession();if(s.data.session)claim()}
function fail(t){document.getElementById("app").innerHTML='<div class="card error"><h2>Invito non disponibile</h2><p>'+esc(t)+'</p></div>'}
function render(){document.getElementById("app").innerHTML='<section class="card"><h2>'+esc(invite.event_name||"Torneo assegnato")+'</h2><div class="muted">'+esc(invite.event_date||"")+(invite.club?" · "+esc(invite.club):"")+'</div><div class="notice success"><b>ACCESSO OPERATIVO LIMITATO</b><br>Potrai inserire risultati e utilizzare le funzioni sportive esclusivamente di questo torneo. Se è un Campionato Nazionale, l’accesso comprende Maschile, Femminile e Misto.</div><div class="notice">Gli altri tornei rimangono disponibili soltanto nelle pagine pubbliche, senza comandi gestionali.</div></section><form id="signup" class="card"><h2>Crea l’account collaboratore</h2><label>Nome visualizzato</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (almeno 8 caratteri)</label><input name="password" type="password" minlength="8" required><button>CREA ACCOUNT</button></form><form id="login" class="card"><h2>Ho già un account</h2><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="secondary">ACCEDI E COLLEGA IL TORNEO</button><div id="msg"></div></form>';
document.getElementById("signup").onsubmit=signup;document.getElementById("login").onsubmit=login}
async function signup(e){e.preventDefault();const name=e.target.elements.name.value.trim(),email=e.target.elements.email.value.trim().toLowerCase(),password=e.target.elements.password.value;if(password.length<8)return show("La password deve contenere almeno 8 caratteri.",true);localStorage.setItem("pam_collaborator_name",name);const redirect=new URL("collaborator-invite.html?invite="+encodeURIComponent(token)+"&confirmed=1",location.href).href;const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirect,data:{display_name:name,account_type:"collaborator_pending"}}});if(r.error)return show(itError(r.error),true);if(r.data.session)return claim();show("Email inviata. Aprila e conferma l’account, poi tornerai automaticamente a questo invito.")}
async function login(e){e.preventDefault();const r=await sb.auth.signInWithPassword({email:e.target.elements.email.value.trim().toLowerCase(),password:e.target.elements.password.value});if(r.error)return show(itError(r.error),true);claim()}
async function claim(){const r=await sb.rpc("claim_collaborator_invite",{p_token:token,p_display_name:localStorage.getItem("pam_collaborator_name")||null});if(r.error)return show(itError(r.error),true);localStorage.removeItem("pam_collaborator_name");const share=r.data&&r.data.share_token||"";location.replace("index.html"+(share?"?tournament="+encodeURIComponent(share):""))}
load();
</script></body></html>

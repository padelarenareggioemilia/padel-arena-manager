<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Inserimento giocatore · Padel Arena Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:18px 14px 60px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:66px;height:66px;border-radius:18px}.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}.muted{color:var(--muted)}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:white}button{width:100%;padding:14px;border:0;border-radius:13px;font-weight:950;background:var(--accent);color:#07111f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:10px}.check input{width:auto}.photo{width:110px;height:110px;object-fit:cover;border-radius:18px;background:white;display:none}@media(max-width:650px){.row{grid-template-columns:1fr}}</style><style id="pamUniversalPageNavStyle">.pam-page-nav{position:sticky;top:8px;z-index:9999;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:920px;margin:10px auto;padding:8px;border:1px solid #365474;border-radius:16px;background:rgba(7,17,31,.95);backdrop-filter:blur(12px)}.pam-page-nav button{min-height:44px;border:1px solid #365474;border-radius:12px;background:#17304e;color:#fff;font-weight:900}.pam-page-menu{position:fixed;inset:0;z-index:100000;background:rgba(3,11,22,.93);display:flex;justify-content:center;align-items:flex-start;padding:76px 14px}.pam-page-menu-card{width:min(460px,100%);background:#102139;border:1px solid #365477;border-radius:20px;padding:16px;color:#fff}.pam-page-menu-card button,.pam-page-menu-card a{display:block;width:100%;margin:8px 0;padding:13px;border:1px solid #365474;border-radius:12px;background:#17304e;color:#fff;text-align:center;text-decoration:none;font-weight:900}@media print{.pam-page-nav,.pam-page-menu{display:none!important}}</style></head><body><div class="pam-page-nav"><button type="button" onclick="pamPageBack()">← Indietro</button><button type="button" onclick="pamPageHome()">⌂ Home</button><button type="button" onclick="pamPageMenu()">☰ Menu</button></div><main><div class="brand"><img src="assets/padel-arena-manager-logo.png"><div><h1>Padel Arena Manager</h1><div class="muted">ROSA AICS PADEL CHAMPIONSHIP 2027</div></div></div><div id="app"><div class="card">Verifica del link...</div></div></main><script>const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});const token=new URLSearchParams(location.search).get('team');let team;const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){if(!token)return fail('Link non valido.');const {data,error}=await sb.rpc('public_championship_team_for_roster',{p_token:token});if(error||!data)return fail(error?.message||'Link non attivo.');team=data;render()}function fail(m){document.getElementById('app').innerHTML='<div class="card error">'+esc(m)+'</div>'}function render(){document.getElementById('app').innerHTML='<section class="card"><h2>'+esc(team.team_name)+'</h2><div class="muted">'+esc(team.club_legal_name||'')+' · '+esc(team.series||'')+'</div><div class="notice success"><b>Link corretto della squadra.</b> La richiesta sarà valutata dal capitano e dall’organizzazione.</div></section><form id="f" class="card"><div class="row"><div><label>Nome *</label><input name="first_name" required></div><div><label>Cognome *</label><input name="last_name" required></div></div><div class="row"><div><label>Data di nascita *</label><input name="birth_date" type="date" required></div><div><label>Luogo di nascita *</label><input name="birth_place" required></div></div><div class="row"><div><label>CAP *</label><input name="postal_code" required></div><div><label>Comune di residenza *</label><input name="residence_town" required></div></div><div class="row"><div><label>Provincia *</label><input name="residence_province" maxlength="2" required></div><div><label>Telefono *</label><input name="phone" type="tel" required></div></div><label>Email *</label><input name="email" type="email" required><div class="row"><div><label>Sesso *</label><select name="gender" required><option value="">Seleziona</option><option>Maschile</option><option>Femminile</option><option>Altro / non binario</option></select></div><div><label>Livello</label><input name="level"></div></div><label>Foto riconoscibile *</label><input id="photo" type="file" accept="image/*" required><img id="preview" class="photo"><label>Note</label><textarea name="notes"></textarea><label class="check"><input name="privacy" type="checkbox" required> Accetto il trattamento dei dati per la gestione sportiva.</label><label class="check"><input name="regulation" type="checkbox" required> Dichiaro di aver letto e accettato il regolamento.</label><button id="send" type="submit">INVIA RICHIESTA</button><div id="msg"></div></form>';
const ph=document.getElementById('photo');ph.onchange=()=>{const f=ph.files[0];if(f){const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}};document.getElementById('f').onsubmit=submit}
async function submit(e){e.preventDefault();const f=e.target,btn=document.getElementById('send'),msg=document.getElementById('msg');try{btn.disabled=true;btn.textContent='INVIO...';const file=document.getElementById('photo').files[0];if(!file)throw new Error('Carica una foto riconoscibile.');if(file.size>3000000)throw new Error('La foto supera 3 MB.');const reader=new FileReader();const photo=await new Promise((ok,no)=>{reader.onload=()=>ok(String(reader.result));reader.onerror=no;reader.readAsDataURL(file)});const fd=new FormData(f);const payload={first_name:fd.get('first_name'),last_name:fd.get('last_name'),birth_date:fd.get('birth_date'),birth_place:fd.get('birth_place'),postal_code:fd.get('postal_code'),residence_town:fd.get('residence_town'),residence_province:String(fd.get('residence_province')).toUpperCase(),phone:fd.get('phone'),email:String(fd.get('email')).toLowerCase(),gender:fd.get('gender'),level:fd.get('level'),notes:fd.get('notes'),photo_data:photo};const {data,error}=await sb.rpc('public_submit_championship_roster_player',{p_token:token,p_payload:payload});if(error)throw error;document.getElementById('app').innerHTML='<div class="card success"><h2>RICHIESTA INVIATA</h2><p>'+esc(data?.message||'La richiesta è in attesa di approvazione.')+'</p></div>'}catch(err){msg.className='notice error';msg.textContent=err.message;btn.disabled=false;btn.textContent='INVIA RICHIESTA'}}load();</script><script id="pamUniversalPageNavScript">function pamAppBase(){return location.href.split('?')[0].replace(/(?:captain-portal|player-registration|public-registration|poster)\.html$/i,'index.html')}function pamPageHome(){location.href=pamAppBase()}function pamPageBack(){if(history.length>1)history.back();else pamPageHome()}function pamPageMenu(){if(document.getElementById('pamPageMenu'))return;const d=document.createElement('div');d.id='pamPageMenu';d.className='pam-page-menu';d.innerHTML='<div class="pam-page-menu-card"><button onclick="document.getElementById(\'pamPageMenu\').remove()">Chiudi</button><a href="'+pamAppBase()+'">⌂ Home pubblica</a><a href="'+pamAppBase()+'?open=events">🎾 Tornei</a><a href="'+pamAppBase()+'?open=championship">🏆 Campionato</a><a href="'+pamAppBase()+'?login=1">🔐 Accedi</a></div>';document.body.appendChild(d)}</script></body></html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111F">
<title>Iscrizione torneo · Padel Arena Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
main{max-width:820px;margin:auto;padding:18px 14px 60px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:15px}.brand img{width:66px;height:66px;border-radius:18px}.brand h1{margin:0;font-size:24px}.brand small{color:var(--muted);letter-spacing:.08em}
.card{background:rgba(16,35,59,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 16px 44px rgba(0,0,0,.22)}h2,h3{margin:0 0 12px}.muted{color:var(--muted)}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}
label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:white}button{padding:13px 16px;border:0;border-radius:12px;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:white;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}
.search-results{display:grid;gap:8px;margin-top:8px}.person-result{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#09182a;color:white;border:1px solid #365474}.person-result span{display:block}.person-result small{color:var(--muted)}.selected-person{padding:12px;border:2px solid var(--accent);border-radius:14px;background:#0d291d}
.required{color:#ff8585}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode-grid button.on{outline:3px solid var(--accent);background:#20405f}.privacy{font-size:12px;color:var(--muted);line-height:1.45}
@media(max-width:650px){.row,.mode-grid{grid-template-columns:1fr}.brand h1{font-size:20px}}
</style>
</head>
<body>
<main>
 <div class="brand"><img src="assets/padel-arena-manager-logo.jpg" alt=""><div><h1>Padel Arena Manager</h1><small>ISCRIZIONE PUBBLICA</small></div></div>
 <div id="app"><div class="card">Caricamento torneo...</div></div>
</main>
<script>
const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});
const token=new URLSearchParams(location.search).get("tournament");
let tournament=null;
let mode="single";
let primary={type:"existing",id:null,name:""};
let partner={type:"existing",id:null,name:""};

const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function loadTournament(){
 if(!token){showError("Link di iscrizione non valido.");return}
 const {data,error}=await sb.rpc("public_tournament_for_registration",{p_share_token:token});
 if(error||!data){showError(error?.message||"Torneo non trovato.");return}
 tournament=data;render();
}
function showError(msg){document.getElementById("app").innerHTML='<div class="card error">'+esc(msg)+'</div>'}
function personSection(kind,title){
 const p=kind==="primary"?primary:partner;
 return '<section class="card" id="'+kind+'Section"><h3>'+title+'</h3>'+
  '<div class="actions"><button type="button" class="secondary '+(p.type==="existing"?"on":"")+'" data-person-type="'+kind+'" data-type="existing">SONO GIÀ IN ANAGRAFICA</button>'+
  '<button type="button" class="secondary '+(p.type==="new"?"on":"")+'" data-person-type="'+kind+'" data-type="new">NUOVA REGISTRAZIONE</button></div>'+
  (p.type==="existing"?existingSearch(kind,p):newForm(kind))+
 '</section>';
}
function existingSearch(kind,p){
 return '<label>Scrivi almeno una parte del nome o del cognome</label>'+
  '<input type="search" data-search-person="'+kind+'" placeholder="Esempio: Franc Lig">'+
  '<div class="search-results" id="'+kind+'Results"></div>'+
  (p.id?'<div class="selected-person"><b>SELEZIONATO</b><br>'+esc(p.name)+' <button type="button" class="danger" data-clear-person="'+kind+'">Cambia</button></div>':'');
}
function newForm(kind){
 const f=n=>kind+"_"+n;
 return '<div class="row"><div><label>Nome <span class="required">*</span></label><input id="'+f("firstName")+'" required></div>'+
 '<div><label>Cognome <span class="required">*</span></label><input id="'+f("lastName")+'" required></div></div>'+
 '<div class="row"><div><label>Data di nascita <span class="required">*</span></label><input id="'+f("birth")+'" type="date" required></div>'+
 '<div><label>Luogo di nascita <span class="required">*</span></label><input id="'+f("birthPlace")+'" required></div></div>'+
 '<div class="row"><div><label>CAP di residenza <span class="required">*</span></label><input id="'+f("postalCode")+'" inputmode="numeric" required></div>'+
 '<div><label>Comune di residenza <span class="required">*</span></label><input id="'+f("residenceTown")+'" required></div></div>'+
 '<div class="row"><div><label>Provincia di residenza <span class="required">*</span></label><input id="'+f("residenceProvince")+'" maxlength="2" placeholder="RE" required></div>'+
 '<div><label>Telefono <span class="required">*</span></label><input id="'+f("phone")+'" type="tel" required></div></div>'+
 '<label>Indirizzo email <span class="required">*</span></label><input id="'+f("email")+'" type="email" required>'+
 '<div class="row"><div><label>Sesso facoltativo</label><select id="'+f("gender")+'"><option value="">Non indicato</option><option>Maschile</option><option>Femminile</option></select></div>'+
 '<div><label>Livello facoltativo</label><input id="'+f("level")+'" placeholder="Principiante, intermedio..."></div></div>'+
 '<label>Note facoltative</label><textarea id="'+f("notes")+'" rows="2"></textarea>';
}
function render(){
 document.documentElement.style.setProperty("--accent",tournament.accent||"#9dff25");
 document.getElementById("app").innerHTML=
 '<section class="card"><h2>'+esc(tournament.name)+'</h2><div class="muted">'+esc(tournament.date||"")+' · '+esc(tournament.club||"")+'</div>'+
 (tournament.address?'<div class="notice">'+esc(tournament.address)+'</div>':'')+
 '<div class="notice success"><b>Nessun accesso richiesto.</b><br>Puoi esclusivamente inviare la tua iscrizione. Non puoi modificare il torneo, gli altri giocatori o i risultati.</div></section>'+
 '<section class="card"><h3>COME VUOI ISCRIVERTI?</h3><div class="mode-grid">'+
  '<button type="button" class="secondary '+(mode==="single"?"on":"")+'" data-mode="single">ISCRIZIONE INDIVIDUALE</button>'+
  '<button type="button" class="secondary '+(mode==="pair"?"on":"")+'" data-mode="pair">ISCRIZIONE CON PARTNER</button>'+
 '</div></section>'+
 personSection("primary","I TUOI DATI")+
 (mode==="pair"?personSection("partner","DATI DEL PARTNER"):"")+
 '<section class="card"><div class="privacy">I dati vengono utilizzati esclusivamente per gestire l’iscrizione al torneo e aggiornare l’anagrafica sportiva dell’organizzatore.</div>'+
 '<button type="button" class="primary" id="submitRegistration" style="width:100%;margin-top:14px">CONFERMA ISCRIZIONE</button><div id="submitMessage"></div></section>';
}
async function searchPlayers(kind,q){
 const box=document.getElementById(kind+"Results");if(!box)return;
 if(q.trim().length<2){box.innerHTML='<div class="muted">Scrivi almeno 2 caratteri.</div>';return}
 box.innerHTML='<div class="muted">Ricerca...</div>';
 const {data,error}=await sb.rpc("public_search_players_for_registration",{p_share_token:token,p_query:q.trim()});
 if(error){box.innerHTML='<div class="error notice">'+esc(error.message)+'</div>';return}
 box.innerHTML=(data||[]).length?(data||[]).map(p=>
  '<button type="button" class="person-result" data-select-person="'+kind+'" data-id="'+p.id+'" data-name="'+esc(p.full_name)+'"><span><b>'+esc(p.full_name)+'</b><small>Giocatore già presente</small></span><b>SELEZIONA</b></button>'
 ).join(""):'<div class="notice">Nessun giocatore trovato. Usa <b>NUOVA REGISTRAZIONE</b>.</div>';
}
function readNew(kind){
 const get=n=>document.getElementById(kind+"_"+n)?.value.trim()||"";
 const obj={
  firstName:get("firstName"),lastName:get("lastName"),birth:get("birth"),birthPlace:get("birthPlace"),
  postalCode:get("postalCode"),residenceTown:get("residenceTown"),residenceProvince:get("residenceProvince").toUpperCase(),
  phone:get("phone"),email:get("email").toLowerCase(),gender:get("gender"),level:get("level"),notes:get("notes")
 };
 const required=["firstName","lastName","birth","birthPlace","postalCode","residenceTown","residenceProvince","phone","email"];
 for(const k of required)if(!obj[k])throw new Error("Completa tutti i campi obbligatori.");
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(obj.email))throw new Error("Inserisci un indirizzo email valido.");
 return {kind:"new",data:obj};
}
function payloadFor(kind){
 const p=kind==="primary"?primary:partner;
 if(p.type==="existing"){
  if(!p.id)throw new Error(kind==="primary"?"Seleziona il tuo nominativo.":"Seleziona il partner.");
  return {kind:"existing",player_id:p.id};
 }
 return readNew(kind);
}
async function submit(){
 const btn=document.getElementById("submitRegistration"),msg=document.getElementById("submitMessage");
 try{
  btn.disabled=true;btn.textContent="INVIO IN CORSO...";
  const primaryPayload=payloadFor("primary");
  const partnerPayload=mode==="pair"?payloadFor("partner"):null;
  if(mode==="pair"&&primaryPayload.kind==="existing"&&partnerPayload.kind==="existing"&&primaryPayload.player_id===partnerPayload.player_id)throw new Error("Il giocatore e il partner devono essere persone diverse.");
  const {data,error}=await sb.rpc("public_submit_tournament_registration_request",{
   p_share_token:token,p_mode:mode,p_primary:primaryPayload,p_partner:partnerPayload
  });
  if(error)throw error;
  document.getElementById("app").innerHTML='<div class="card success"><h2>RICHIESTA INVIATA</h2><p>'+esc(data.message||"La richiesta è stata inviata all’organizzatore.")+'</p><p>Puoi chiudere questa pagina.</p></div>';
 }catch(err){
  msg.className="notice error";msg.textContent=err.message;
  btn.disabled=false;btn.textContent="CONFERMA ISCRIZIONE";
 }
}
document.addEventListener("input",e=>{
 const kind=e.target.getAttribute("data-search-person");
 if(kind){clearTimeout(e.target._t);e.target._t=setTimeout(()=>searchPlayers(kind,e.target.value),280)}
});
document.addEventListener("click",e=>{
 const modeBtn=e.target.closest("[data-mode]");if(modeBtn){mode=modeBtn.dataset.mode;render();return}
 const typeBtn=e.target.closest("[data-person-type]");if(typeBtn){
  const kind=typeBtn.dataset.personType,obj=kind==="primary"?primary:partner;
  obj.type=typeBtn.dataset.type;obj.id=null;obj.name="";render();return
 }
 const select=e.target.closest("[data-select-person]");if(select){
  const obj=select.dataset.selectPerson==="primary"?primary:partner;
  obj.type="existing";obj.id=select.dataset.id;obj.name=select.dataset.name;render();return
 }
 const clear=e.target.closest("[data-clear-person]");if(clear){
  const obj=clear.dataset.clearPerson==="primary"?primary:partner;obj.id=null;obj.name="";render();return
 }
 if(e.target.id==="submitRegistration")submit();
});
loadTournament();
</script>
</body>
</html>

<main>
 <div class="brand"><img src="assets/padel-arena-manager-logo.png" alt=""><div><h1>Padel Arena Manager</h1><small>ISCRIZIONE PUBBLICA</small></div><nav class="pub-nav"><a class="home" href="index-v8-lab-v8.2.38.17.html">⌂ HOME</a><a class="login" href="index-v8-lab-v8.2.38.17.html?login=1">🔐 LOGIN</a></nav></div>
 <div id="app"><div class="card">Caricamento torneo...</div></div>
</main>
<script>
const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});
const token=new URLSearchParams(location.search).get("tournament");
let tournament=null;
let publicRegistrations=[];
let organizerContact={name:"",phone:"",email:""};
let mode="single";
let primary={type:"existing",id:null,name:""};
let partner={type:"existing",id:null,name:""};
let nationalCategory="";

const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function loadTournament(){
 if(!token){showError("Link di iscrizione non valido.");return}
 const {data,error}=await sb.rpc("public_tournament_for_registration",{p_share_token:token});
 if(error||!data){showError(error?.message||"Torneo non trovato.");return}
 tournament=data;organizerContact={name:data?.organizer_name||data?.organizerName||"",phone:data?.organizer_phone||data?.organizerPhone||"",email:data?.organizer_email||data?.organizerEmail||""};await loadPublicExtras();render();
}

async function loadPublicExtras(){
 try{
  const [listRes,contactRes]=await Promise.all([
   sb.rpc("public_tournament_registration_list",{p_share_token:token}),
   sb.rpc("public_tournament_contact_info",{p_share_token:token})
  ]);
  if(!listRes.error)publicRegistrations=listRes.data||[];
  if(!contactRes.error&&contactRes.data){
   const c=Array.isArray(contactRes.data)?contactRes.data[0]:contactRes.data;
   organizerContact={name:c?.organizer_name||organizerContact.name||"",phone:c?.organizer_phone||organizerContact.phone||"",email:c?.organizer_email||organizerContact.email||""};
  }
 }catch(e){console.warn("Extra pubblici:",e)}
}
function publicExtrasHtml(){
 const names=(publicRegistrations||[]).filter(function(r){return ["accepted","imported","new","waitlist"].includes(String(r.status||"").toLowerCase())});
 const list='<section class="pub-extra"><h3>Giocatori iscritti ('+names.length+')</h3>'+
  (names.length?names.map(function(r){return '<div class="pub-player">'+esc(r.full_name||"Giocatore")+(r.status==="waitlist"?' · Lista attesa':'')+'</div>'}).join(""):'<div class="muted">Nessun giocatore iscritto al momento.</div>')+'</section>';
 const phone=String(organizerContact.phone||"").replace(/\D/g,""),email=String(organizerContact.email||"").trim();
 let actions="";
 if(phone)actions+='<a href="https://wa.me/'+phone+'?text='+encodeURIComponent("Ciao, ti contatto per "+(tournament?.name||"il torneo Padel Arena"))+'">WhatsApp</a>';
 if(email)actions+='<a href="mailto:'+esc(email)+'?subject='+encodeURIComponent("Informazioni "+(tournament?.name||"torneo Padel Arena"))+'">Email</a>';
 const contact='<section class="pub-extra" id="organizzatore"><h3>Contatta l’organizzatore'+(organizerContact.name?' · '+esc(organizerContact.name):'')+'</h3>'+
  (actions?'<div class="pub-contact-actions">'+actions+'</div>':'<div class="muted">Contatti organizzatore non ancora configurati.</div>')+'</section>';
 return list+contact;
}

function showError(msg){document.getElementById("app").innerHTML='<div class="card error">'+esc(msg)+'</div>'}
function publicRegulationHtml(){
 const text=String(tournament&&tournament.regulation_text||"").trim();
 const url=String(tournament&&tournament.regulation_file_url||"").trim();
 if(!text&&!url)return "";
 return '<section class="card"><h3>REGOLAMENTO DELL’EVENTO</h3>'+
  (text?'<div class="notice" style="white-space:pre-wrap">'+esc(text)+'</div>':'')+
  (url?'<a class="secondary" style="display:block;text-align:center;text-decoration:none" href="'+esc(url)+'" target="_blank" rel="noopener">📎 APRI '+esc(tournament.regulation_file_name||"IL REGOLAMENTO")+'</a>':'')+
 '</section>';
}
function isNationalTournament(){
 return String(tournament&&(tournament.competition_type||tournament.competitionType)||"").toLowerCase()==="national_event";
}
function nationalPersonForm(kind,title){
 const f=n=>kind+"_national_"+n;
 return '<section class="card"><h3><span class="national-step">'+(kind==="primary"?'2':'3')+'</span>'+title+'</h3>'+
  '<div class="row"><div><label>Nome <span class="required">*</span></label><input id="'+f('firstName')+'" autocomplete="given-name" required></div><div><label>Cognome <span class="required">*</span></label><input id="'+f('lastName')+'" autocomplete="family-name" required></div></div>'+
  '<div class="row"><div><label>Data di nascita <span class="required">*</span></label><input id="'+f('birth')+'" type="date" required></div><div><label>Luogo di nascita <span class="required">*</span></label><input id="'+f('birthPlace')+'" required></div></div>'+
  '<div class="row"><div><label>Eventuale classifica FITP</label><input id="'+f('fitpRanking')+'" placeholder="Es. 4.1 oppure NC"></div><div><label>Hai la tessera AICS? <span class="required">*</span></label><select id="'+f('aicsMember')+'" data-aics-member="'+kind+'" required><option value="">Seleziona</option><option value="Si">SÌ</option><option value="No">NO</option><option value="Non so">NON SO</option></select><div id="'+f('aicsHelp')+'" class="aics-help hidden"></div></div></div>'+
  '<div class="row"><div><label>Taglia T-shirt <span class="required">*</span></label><select id="'+f('shirtSize')+'" required><option value="">Seleziona</option>'+['XS','S','M','L','XL','XXL','XXXL'].map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
  (nationalCategory==='Misto'&&kind==='primary'?'<div><label>Sesso giocatore/giocatrice 1 <span class="required">*</span></label><select id="nationalMixedPrimaryGender" required><option value="">Seleziona</option><option value="Maschile">UOMO</option><option value="Femminile">DONNA</option></select><small class="field-help">Il componente 2 verrà impostato automaticamente con sesso opposto.</small></div>':'<div></div>')+'</div>'+
  '<div class="row"><div><label>Telefono cellulare <span class="required">*</span></label><input id="'+f('phone')+'" type="tel" autocomplete="tel" required></div><div><label>Indirizzo email <span class="required">*</span></label><input id="'+f('email')+'" type="email" autocomplete="email" required><small class="field-help">Controlla con attenzione: qui arriveranno le comunicazioni.</small></div></div></section>';
}
function updateNationalAicsHelp(kind,value){
 const box=document.getElementById(kind+'_national_aicsHelp');if(!box)return;
 const messages={
  'Si':'Perfetto. Verificheremo noi il numero della tessera AICS: non devi preoccuparti di inserirlo.',
  'No':'Nessun problema. Potrai fare la tessera AICS direttamente il giorno del torneo al costo di soli 5 €. Sarai coperto/a per tutta la durata del torneo da tutte le coperture previste dal tesseramento.',
  'Non so':'Non preoccuparti: verificheremo noi. Se non risultassi tesserato/a, potrai fare la tessera direttamente il giorno del torneo al costo di soli 5 €.'
 };
 box.textContent=messages[value]||'';box.classList.toggle('hidden',!messages[value]);
}
function nationalLogosHtml(){
 return '<div class="national-logos"><div><img src="assets/aics-logo.png" alt="AICS Settore Tennis e Padel Nazionale"></div><div><img src="assets/misano-sporting-club.png" alt="Misano Sporting Club"></div><div><img src="assets/mixsport.png" alt="Mixsport Riccione"></div></div>';
}
const NATIONAL_PAYMENT={beneficiary:'AICS ASSOCIAZIONE ITALIANA CULTURA SPORT APS DIREZ. NAZIONALE',iban:'IT 75 I 01030 03271 000061460833',reason:'Campionato Nazionale Padel 2026',receiptEmail:'nazionalipadel@aicstennis.it'};
function nationalPaymentHtml(){
 return '<div class="notice payment-warning"><b>PAGAMENTO E VALIDITÀ DELL’ISCRIZIONE</b><br><b>30 € a persona</b> per una categoria · <b>40 € a persona</b> per due categorie.'+
  '<div class="bank-details"><div><span>Intestatario</span><b>'+esc(NATIONAL_PAYMENT.beneficiary)+'</b></div><div class="copy-row"><div><span>IBAN</span><b>'+esc(NATIONAL_PAYMENT.iban)+'</b></div><button type="button" class="secondary" data-copy-value="'+esc(NATIONAL_PAYMENT.iban.replace(/\s/g,''))+'">COPIA</button></div><div class="copy-row"><div><span>Causale</span><b>'+esc(NATIONAL_PAYMENT.reason)+'</b></div><button type="button" class="secondary" data-copy-value="'+esc(NATIONAL_PAYMENT.reason)+'">COPIA</button></div></div>'+
  '<br>La ricevuta deve essere inviata a <a href="mailto:'+NATIONAL_PAYMENT.receiptEmail+'">'+NATIONAL_PAYMENT.receiptEmail+'</a>.<br><b>L’iscrizione è valida soltanto dopo il ricevimento della ricevuta.</b></div>';
}
function nationalReceiptMailLink(p1,p2){
 const subject='Ricevuta iscrizione · '+(tournament?.name||'Campionato Nazionale Padel 2026');
 const body='Buongiorno,\n\nallego la ricevuta del bonifico per l’iscrizione al Campionato Nazionale Padel 2026.\n\nCategoria: Doppio '+nationalCategory+'\nGiocatore 1: '+p1.data.firstName+' '+p1.data.lastName+'\nGiocatore 2: '+p2.data.firstName+' '+p2.data.lastName+'\n\nCausale: '+NATIONAL_PAYMENT.reason+'\n\nCordiali saluti.';
 return 'mailto:'+NATIONAL_PAYMENT.receiptEmail+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}
function nationalStayDefaultText(p1,p2,checkIn,checkOut,companions){
 return 'Buongiorno AICS Travel,\n\nchiedo disponibilità per il soggiorno in occasione del Campionato Nazionale AICS Padel 2026 a Misano Adriatico.\n\nGiocatori:\n- '+p1.data.firstName+' '+p1.data.lastName+'\n- '+p2.data.firstName+' '+p2.data.lastName+'\n\nCategoria: Doppio '+nationalCategory+'\nCheck-in richiesto: '+checkIn+'\nCheck-out richiesto: '+checkOut+'\nAccompagnatori: '+companions+'\n\nEventuali altre notti o richieste:\n[Scrivere qui]\n\nRecapito telefonico: '+p1.data.phone+'\nEmail: '+p1.data.email+'\n\nResto in attesa di disponibilità, struttura proposta e condizioni convenzionate.\n\nCordiali saluti.';
}
function nationalStayHtml(p1,p2){
 const text=nationalStayDefaultText(p1,p2,'5 settembre 2026','6 settembre 2026','0');
 return '<section class="card stay-box"><h3>🏨 PRENOTAZIONE PERNOTTAMENTO · AICS TRAVEL</h3><p class="official-note">La sistemazione alberghiera è gestita direttamente da <b>AICS Travel</b>, in base alla disponibilità e alle condizioni convenzionate. Il soggiorno indicato dalla circolare è dalla notte del 5 settembre, con uscita il 6; puoi richiedere altre notti o aggiungere accompagnatori.</p><div class="row"><div><label>Check-in</label><select id="stayCheckIn"><option>4 settembre 2026</option><option selected>5 settembre 2026</option><option>6 settembre 2026</option></select></div><div><label>Check-out</label><select id="stayCheckOut"><option>5 settembre 2026</option><option selected>6 settembre 2026</option><option>7 settembre 2026</option></select></div></div><label>Numero accompagnatori</label><input id="stayCompanions" type="number" min="0" value="0"><label>Testo dell’email modificabile</label><textarea id="stayEmailText">'+esc(text)+'</textarea><a id="sendStayEmail" class="primary mail-link" href="mailto:info@aicstravel.it?subject='+encodeURIComponent('Richiesta pernottamento · Campionato Nazionale AICS Padel 2026')+'&body='+encodeURIComponent(text)+'">INVIA RICHIESTA AD AICS TRAVEL</a><div class="muted" style="margin-top:9px">Destinatario: info@aicstravel.it · Tel. 375 7990658 (Michela Tesi). Prima dell’invio puoi modificare liberamente il testo.</div></section>';
}
function refreshNationalStayEmail(){
 const people=window.__nationalStayPeople;if(!people)return;
 const checkIn=document.getElementById('stayCheckIn')?.value||'5 settembre 2026';
 const checkOut=document.getElementById('stayCheckOut')?.value||'6 settembre 2026';
 const companions=document.getElementById('stayCompanions')?.value||'0';
 const textarea=document.getElementById('stayEmailText');if(!textarea)return;
 textarea.value=nationalStayDefaultText(people.p1,people.p2,checkIn,checkOut,companions);
 updateNationalStayMailLink();
}
function updateNationalStayMailLink(){
 const text=document.getElementById('stayEmailText')?.value||'';
 const link=document.getElementById('sendStayEmail');if(!link)return;
 link.href='mailto:info@aicstravel.it?subject='+encodeURIComponent('Richiesta pernottamento · Campionato Nazionale AICS Padel 2026')+'&body='+encodeURIComponent(text);
}
async function copyPublicValue(value){
 try{await navigator.clipboard.writeText(value);alert('Dato copiato.')}catch(_){prompt('Copia questo dato:',value)}
}
function renderNational(){
 document.documentElement.style.setProperty("--accent",tournament.accent||"#9dff25");
 document.getElementById("app").innerHTML=
  '<section class="card">'+nationalLogosHtml()+'<h2>'+esc(tournament.name||'Campionati Nazionali Padel')+'</h2><div class="muted">'+esc(tournament.date||'')+' · '+esc(tournament.club||'')+'</div>'+
  (tournament.description?'<div class="notice">'+esc(tournament.description)+'</div>':'')+'<div class="notice success"><b>UN SOLO MODULO PER TUTTE LE CATEGORIE</b><br>Scegli la categoria e inserisci i dati completi di entrambi i componenti della coppia.</div>'+nationalPaymentHtml()+'<div class="notice stay-box"><b>PERNOTTAMENTO CON AICS TRAVEL</b><br>Dopo l’iscrizione potrai preparare direttamente un’email a <b>info@aicstravel.it</b>, già compilata con i dati della coppia e le notti richieste, ma completamente modificabile.</div></section>'+publicRegulationHtml()+
  '<section class="card"><h3><span class="national-step">1</span>Scegli la categoria</h3><div class="category-grid">'+['Maschile','Femminile','Misto'].map(c=>'<button type="button" class="'+(nationalCategory===c?'on':'')+'" data-national-category="'+c+'">DOPPIO '+c.toUpperCase()+'</button>').join('')+'</div></section>'+
  (nationalCategory?nationalPersonForm('primary','DATI GIOCATORE / GIOCATRICE 1')+nationalPersonForm('partner','DATI GIOCATORE / GIOCATRICE 2'):'<section class="card notice">Seleziona prima la categoria per proseguire.</section>')+
  (nationalCategory?'<section class="card"><h3><span class="national-step">4</span>Conferma e invia</h3>'+nationalPaymentHtml()+
  '<details class="notice"><summary><b>Informativa privacy</b></summary><p class="privacy">I dati personali saranno trattati ai sensi dell’art. 13 del GDPR 2016/679/UE per la gestione dell’evento e per le comunicazioni inerenti l’attività statutaria e regolamentare AICS.</p></details>'+
  '<label class="privacy-check"><input id="nationalPrivacy" type="checkbox"><span>Confermo di aver letto l’informativa, acconsento al trattamento dei dati e dichiaro di essere autorizzato/a a comunicare i dati del secondo componente della coppia. <span class="required">*</span></span></label>'+
  '<button type="button" class="primary" id="submitNationalRegistration" style="width:100%;margin-top:14px">INVIA ISCRIZIONE DELLA COPPIA</button><div id="submitMessage"></div></section>':'');
}
function nationalReadPerson(kind){
 const get=n=>document.getElementById(kind+"_national_"+n)?.value.trim()||"";
 const mixedPrimary=document.getElementById('nationalMixedPrimaryGender')?.value||"";
 const gender=nationalCategory==='Maschile'?'Maschile':nationalCategory==='Femminile'?'Femminile':kind==='primary'?mixedPrimary:(mixedPrimary==='Maschile'?'Femminile':mixedPrimary==='Femminile'?'Maschile':'');
 const data={firstName:get('firstName'),lastName:get('lastName'),birth:get('birth'),birthPlace:get('birthPlace'),fitpRanking:get('fitpRanking'),aicsMember:get('aicsMember'),shirtSize:get('shirtSize'),phone:get('phone'),email:get('email').toLowerCase(),gender:gender,nationalCategory:nationalCategory,notes:'Iscrizione Campionati Nazionali Padel'};
 for(const k of ['firstName','lastName','birth','birthPlace','aicsMember','shirtSize','phone','email'])if(!data[k])throw new Error('Completa tutti i campi obbligatori di entrambi i giocatori.');
 if(nationalCategory==='Misto'&&!gender)throw new Error('Indica il sesso del primo componente della coppia mista.');
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email))throw new Error('Controlla gli indirizzi email inseriti.');
 return {kind:'new',data:data};
}
async function submitNational(){
 const btn=document.getElementById('submitNationalRegistration'),msg=document.getElementById('submitMessage');
 try{
  if(!nationalCategory)throw new Error('Seleziona la categoria.');
  if(!document.getElementById('nationalPrivacy')?.checked)throw new Error('Devi accettare l’informativa privacy.');
  btn.disabled=true;btn.textContent='INVIO IN CORSO...';
  const p1=nationalReadPerson('primary'),p2=nationalReadPerson('partner');
  if(p1.data.email===p2.data.email&&p1.data.firstName===p2.data.firstName&&p1.data.lastName===p2.data.lastName)throw new Error('I due componenti della coppia devono essere persone diverse.');
  const {error}=await sb.rpc('public_submit_tournament_registration_request',{p_share_token:token,p_mode:'pair',p_primary:p1,p_partner:p2});
  if(error)throw error;
  window.__nationalStayPeople={p1:p1,p2:p2};
  document.getElementById('app').innerHTML='<section class="card success">'+nationalLogosHtml()+'<h2>ISCRIZIONE INVIATA</h2><p>La coppia è stata registrata nella categoria <b>'+esc(nationalCategory)+'</b>.</p>'+nationalPaymentHtml()+'<a class="primary mail-link" href="'+esc(nationalReceiptMailLink(p1,p2))+'">INVIA LA RICEVUTA VIA EMAIL</a><p class="muted">Allega manualmente la ricevuta prima di inviare l’email.</p></section>'+nationalStayHtml(p1,p2);
 }catch(err){if(msg){msg.className='notice error';msg.textContent=err.message}if(btn){btn.disabled=false;btn.textContent='INVIA ISCRIZIONE DELLA COPPIA'}}
}
function personSection(kind,title){
 const p=kind==="primary"?primary:partner;
 return '<section class="card" id="'+kind+'Section"><h3>'+title+'</h3>'+
  '<div class="actions"><button type="button" class="secondary '+(p.type==="existing"?"on":"")+'" data-person-type="'+kind+'" data-type="existing">SONO GIÀ IN ANAGRAFICA</button>'+
  '<button type="button" class="secondary '+(p.type==="new"?"on":"")+'" data-person-type="'+kind+'" data-type="new">NUOVA REGISTRAZIONE</button></div>'+
  (p.type==="existing"?existingSearch(kind,p):newForm(kind))+
 '</section>';
}
function existingSearch(kind,p){
 return '<label>Scrivi almeno una parte del nome o del cognome</label>'+
  '<input type="search" data-search-person="'+kind+'" placeholder="Esempio: Franc Lig">'+
  '<div class="search-results" id="'+kind+'Results"></div>'+
  (p.id?'<div class="selected-person"><b>SELEZIONATO</b><br>'+esc(p.name)+' <button type="button" class="danger" data-clear-person="'+kind+'">Cambia</button></div><div class="notice"><b>Conferma e completa i dati obbligatori.</b> Per tutelare la privacy non mostriamo i dati già presenti.</div>'+newForm(kind):'');
}
function newForm(kind){
 const f=n=>kind+"_"+n;
 return '<div class="row"><div><label>Nome <span class="required">*</span></label><input id="'+f("firstName")+'" required></div>'+
 '<div><label>Cognome <span class="required">*</span></label><input id="'+f("lastName")+'" required></div></div>'+
 '<div class="row"><div><label>Data di nascita <span class="required">*</span></label><input id="'+f("birth")+'" type="date" required></div>'+
 '<div><label>Luogo di nascita <span class="required">*</span></label><input id="'+f("birthPlace")+'" required></div></div>'+
 '<div class="row"><div><label>CAP di residenza <span class="required">*</span></label><input id="'+f("postalCode")+'" inputmode="numeric" required></div>'+
 '<div><label>Comune di residenza <span class="required">*</span></label><input id="'+f("residenceTown")+'" required></div></div>'+
 '<div class="row"><div><label>Provincia di residenza <span class="required">*</span></label><input id="'+f("residenceProvince")+'" maxlength="2" autocomplete="address-level1" placeholder="Digita la sigla (es. RE)" required><small class="field-help">CAMPO OBBLIGATORIO: inserisci le 2 lettere della provincia.</small></div>'+
 '<div><label>Telefono <span class="required">*</span></label><input id="'+f("phone")+'" type="tel" required></div></div>'+
 '<label>Indirizzo email <span class="required">*</span></label><input id="'+f("email")+'" type="email" required>'+
 '<div class="row"><div><label>Sesso <span class="required">*</span></label><select id="'+f("gender")+'" required><option value="">Seleziona</option><option>Maschile</option><option>Femminile</option><option>Altro / non binario</option></select></div>'+
 '<div><label>Livello facoltativo</label><input id="'+f("level")+'" placeholder="Principiante, intermedio..."></div></div>'+
 '<label>Note facoltative</label><textarea id="'+f("notes")+'" rows="2"></textarea>';
}
function isFixedPairsTournament(){
 return String(tournament&&tournament.competition_type||"").toLowerCase()==="fixed_pairs";
}
function normalizeRegistrationMode(){
 if(!isFixedPairsTournament())mode="single";
}
function render(){
 if(isNationalTournament()){renderNational();return}
 normalizeRegistrationMode();
 document.documentElement.style.setProperty("--accent",tournament.accent||"#9dff25");
 document.getElementById("app").innerHTML=
 '<section class="card"><h2>'+esc(tournament.name)+'</h2><div class="muted">'+esc(tournament.date||"")+' · '+esc(tournament.club||"")+'</div>'+
 (tournament.address?'<div class="notice">'+esc(tournament.address)+'</div>':'')+
 '<div class="notice success"><b>Nessun accesso richiesto.</b><br>Puoi esclusivamente inviare la tua iscrizione. Non puoi modificare il torneo, gli altri giocatori o i risultati.</div></section>'+publicRegulationHtml()+
 publicExtrasHtml()+
 (isFixedPairsTournament()?'<section class="card"><h3>COME VUOI ISCRIVERTI?</h3><div class="mode-grid">'+
  '<button type="button" class="secondary '+(mode==="single"?"on":"")+'" data-mode="single">ISCRIZIONE INDIVIDUALE</button>'+
  '<button type="button" class="secondary '+(mode==="pair"?"on":"")+'" data-mode="pair">ISCRIZIONE CON PARTNER</button>'+
 '</div><div class="muted" style="margin-top:10px">Nei tornei a coppie puoi iscriverti singolarmente oppure indicare il partner.</div></section>':'<section class="card"><div class="notice success"><b>ISCRIZIONE INDIVIDUALE</b><br>Nei tornei Rodeo a gettoni e Rodeo semplice ogni giocatore si iscrive singolarmente.</div></section>')+
 personSection("primary","I TUOI DATI")+
 (mode==="pair"?personSection("partner","DATI DEL PARTNER"):"")+
 '<section class="card"><div class="privacy">I dati vengono utilizzati esclusivamente per gestire l’iscrizione al torneo e aggiornare l’anagrafica sportiva dell’organizzatore.</div>'+
 '<button type="button" class="primary" id="submitRegistration" style="width:100%;margin-top:14px">CONFERMA ISCRIZIONE</button><div id="submitMessage"></div></section>';
}
async function searchPlayers(kind,q){
 const box=document.getElementById(kind+"Results");if(!box)return;
 if(q.trim().length<2){box.innerHTML='<div class="muted">Scrivi almeno 2 caratteri.</div>';return}
 box.innerHTML='<div class="muted">Ricerca...</div>';
 const {data,error}=await sb.rpc("public_search_players_for_registration",{p_share_token:token,p_query:q.trim()});
 if(error){box.innerHTML='<div class="error notice">'+esc(error.message)+'</div>';return}
 box.innerHTML=(data||[]).length?(data||[]).map(p=>
  '<button type="button" class="person-result" data-select-person="'+kind+'" data-id="'+p.id+'" data-name="'+esc(p.full_name)+'"><span><b>'+esc(p.full_name)+'</b><small>Giocatore già presente</small></span><b>SELEZIONA</b></button>'
 ).join(""):'<div class="notice">Nessun giocatore trovato. Usa <b>NUOVA REGISTRAZIONE</b>.</div>';
}
function readNew(kind){
 const get=n=>document.getElementById(kind+"_"+n)?.value.trim()||"";
 const obj={
  firstName:get("firstName"),lastName:get("lastName"),birth:get("birth"),birthPlace:get("birthPlace"),
  postalCode:get("postalCode"),residenceTown:get("residenceTown"),residenceProvince:get("residenceProvince").toUpperCase(),
  phone:get("phone"),email:get("email").toLowerCase(),gender:get("gender"),level:get("level"),notes:get("notes")
 };
 const required=["firstName","lastName","birth","birthPlace","postalCode","residenceTown","residenceProvince","phone","email","gender"];
 for(const k of required)if(!obj[k])throw new Error("Completa tutti i campi obbligatori.");
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(obj.email))throw new Error("Inserisci un indirizzo email valido.");
 return {kind:"new",data:obj};
}
function payloadFor(kind){
 const p=kind==="primary"?primary:partner;
 if(p.type==="existing"){
  if(!p.id)throw new Error(kind==="primary"?"Seleziona il tuo nominativo.":"Seleziona il partner.");
  return {kind:"existing",player_id:p.id,data:readNew(kind).data};
 }
 return readNew(kind);
}
async function submit(){
 const btn=document.getElementById("submitRegistration"),msg=document.getElementById("submitMessage");
 try{
  btn.disabled=true;btn.textContent="INVIO IN CORSO...";
  normalizeRegistrationMode();
  const primaryPayload=payloadFor("primary");
  const partnerPayload=mode==="pair"?payloadFor("partner"):null;
  if(mode==="pair"&&primaryPayload.kind==="existing"&&partnerPayload.kind==="existing"&&primaryPayload.player_id===partnerPayload.player_id)throw new Error("Il giocatore e il partner devono essere persone diverse.");
  const {data,error}=await sb.rpc("public_submit_tournament_registration_request",{
   p_share_token:token,p_mode:mode,p_primary:primaryPayload,p_partner:partnerPayload
  });
  if(error)throw error;
  document.getElementById("app").innerHTML='<div class="card success"><h2>RICHIESTA INVIATA</h2><p>'+esc(data.message||"La richiesta è stata inviata all’organizzatore.")+'</p><p>Puoi chiudere questa pagina.</p></div>';
 }catch(err){
  msg.className="notice error";msg.textContent=err.message;
  btn.disabled=false;btn.textContent="CONFERMA ISCRIZIONE";
 }
}
document.addEventListener("input",e=>{
 if(e.target.id==='stayEmailText'){updateNationalStayMailLink();return}
 if(e.target.id==='stayCompanions'){refreshNationalStayEmail();return}
 const kind=e.target.getAttribute("data-search-person");
 if(kind){clearTimeout(e.target._t);e.target._t=setTimeout(()=>searchPlayers(kind,e.target.value),280)}
});
document.addEventListener("click",e=>{
 const copy=e.target.closest('[data-copy-value]');if(copy){copyPublicValue(copy.getAttribute('data-copy-value'));return}
 const nationalCategoryBtn=e.target.closest('[data-national-category]');if(nationalCategoryBtn){nationalCategory=nationalCategoryBtn.getAttribute('data-national-category');renderNational();return}
 if(e.target.id==='submitNationalRegistration'){submitNational();return}
 const modeBtn=e.target.closest("[data-mode]");if(modeBtn){mode=modeBtn.dataset.mode;render();return}
 const typeBtn=e.target.closest("[data-person-type]");if(typeBtn){
  const kind=typeBtn.dataset.personType,obj=kind==="primary"?primary:partner;
  obj.type=typeBtn.dataset.type;obj.id=null;obj.name="";render();return
 }
 const select=e.target.closest("[data-select-person]");if(select){
  const obj=select.dataset.selectPerson==="primary"?primary:partner;
  obj.type="existing";obj.id=select.dataset.id;obj.name=select.dataset.name;render();return
 }
 const clear=e.target.closest("[data-clear-person]");if(clear){
  const obj=clear.dataset.clearPerson==="primary"?primary:partner;obj.id=null;obj.name="";render();return
 }
 if(e.target.id==="submitRegistration")submit();
});
document.addEventListener('change',e=>{
 if(e.target.id==='stayCheckIn'||e.target.id==='stayCheckOut'){refreshNationalStayEmail();return}
 const aicsKind=e.target.getAttribute('data-aics-member');if(aicsKind)updateNationalAicsHelp(aicsKind,e.target.value);
});
loadTournament();
</script>
</body>
</html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Portale Capitano · Padel Arena Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:920px;margin:auto;padding:18px 14px 60px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:70px;height:70px;border-radius:18px}.card{background:#10233bf5;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}.muted{color:var(--muted)}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,button{font:inherit}input{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:white}button{padding:13px 16px;border:0;border-radius:12px;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:#07111f}.secondary{background:#17304e;color:white;border:1px solid #3c5d7d}.danger{background:#7f1d1d;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.datum{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line)}.datum b{display:block}.roster{display:grid;gap:10px}.person{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#081829;border:1px solid #2f4c70;border-radius:14px;padding:11px}.person img{width:55px;height:55px;border-radius:50%;object-fit:cover;background:white}.logo{width:100px;height:100px;object-fit:contain;background:white;border-radius:18px;padding:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}.person{grid-template-columns:50px 1fr}.person .actions{grid-column:1/-1}}</style></head><body><main><div class="brand"><img src="assets/padel-arena-manager-logo.png"><div><h1>Padel Arena Manager</h1><div class="muted">PORTALE CAPITANO · AICS 2027</div></div></div><div id="app"><div class="card">Verifica del link...</div></div></main><script>const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const token=new URLSearchParams(location.search).get('invite');let team=null;const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function teamInfo(){const {data,error}=await sb.rpc('public_championship_team_for_captain',{p_token:token});if(error||!data)throw new Error(error?.message||'Link non valido.');team=data;return data}function login(){document.getElementById('app').innerHTML='<section class="card"><h2>Accesso capitano</h2><div class="notice">Crea o usa l’account con l’email comunicata nell’iscrizione della squadra.</div><label>Email</label><input id="email" type="email" value="'+esc(team?.captain_email||'')+'"><label>Password</label><input id="password" type="password"><div class="actions"><button class="primary" id="signin">ENTRA</button><button class="secondary" id="signup">CREA ACCOUNT</button></div><div id="msg"></div></section>';signin.onclick=()=>auth(false);signup.onclick=()=>auth(true)}async function auth(create){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('msg');try{const r=create?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await claim()}catch(e){msg.className='notice error';msg.textContent=e.message}}async function claim(){const {data,error}=await sb.rpc('claim_championship_team_access',{p_token:token});if(error)throw error;team=data;portal()}async function portal(){if(!team)await teamInfo();document.getElementById('app').innerHTML='<section class="card"><h2>'+esc(team.team_name)+'</h2><div class="muted">'+esc(team.series||'')+' · '+esc(team.club_legal_name||'')+'</div><div class="notice success">Puoi lavorare esclusivamente sulla tua squadra.</div></section><section class="card"><h2>Logo squadra</h2><img id="logo" class="logo" src="'+esc(team.team_logo_url||'assets/padel-arena-manager-logo.png')+'"><label>Carica logo</label><input id="logoFile" type="file" accept="image/*"></section><section class="card"><h2>Dati già compilati</h2><div class="grid">'+datum('Capitano',team.captain_name)+datum('Email',team.captain_email)+datum('Telefono',team.captain_phone)+datum('Campo di casa',team.home_court_address)+datum('Giorno',team.home_day)+datum('Orario',team.home_time)+'</div></section><section class="card"><h2>Rosa giocatori</h2><div class="actions"><button class="primary" id="add">INSERISCI GIOCATORE</button><button class="secondary" id="share">INVIA LINK AI GIOCATORI</button><button class="secondary" id="logout">ESCI</button></div><div id="roster" class="roster"><div class="muted">Caricamento...</div></div></section>';logoFile.onchange=saveLogo;add.onclick=()=>location.href='player-registration.html?team='+encodeURIComponent(team.player_invite_token)+'&mode=captain';share.onclick=shareLink;logout.onclick=async()=>{await sb.auth.signOut();login()};loadRoster()}function datum(l,v){return '<div class="datum"><b>'+esc(l)+'</b>'+esc(v||'—')+'</div>'}async function saveLogo(){const f=logoFile.files[0];if(!f)return;if(f.size>2500000)return alert('Logo oltre 2,5 MB.');const r=new FileReader();r.onload=async()=>{const val=String(r.result);const {error}=await sb.from('championship_teams').update({team_logo_url:val,updated_at:new Date().toISOString()}).eq('id',team.id);if(error)return alert(error.message);team.team_logo_url=val;logo.src=val;alert('Logo salvato.')};r.readAsDataURL(f)}function playerUrl(){return new URL('player-registration.html?team='+encodeURIComponent(team.player_invite_token),location.href).href}async function shareLink(){const url=playerUrl(),text='Ciao! Sei stato invitato a inserirti nella rosa di '+team.team_name+'. Apri il link, compila i dati, carica una foto riconoscibile e invia la richiesta. La registrazione resterà in attesa di approvazione. '+url;try{if(navigator.share)await navigator.share({title:'Rosa '+team.team_name,text,url});else{await navigator.clipboard.writeText(text);alert('Messaggio copiato.')}}catch(e){}}async function loadRoster(){const {data,error}=await sb.from('championship_roster_players').select('*').eq('team_id',team.id).order('created_at',{ascending:false});if(error){roster.innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}roster.innerHTML=(data||[]).length?(data||[]).map(r=>'<div class="person"><img src="'+esc(r.photo_data||'assets/padel-arena-manager-logo.png')+'"><div><b>'+esc(r.first_name+' '+r.last_name)+'</b><div class="muted">'+esc(r.status||'pending')+' · '+esc(r.email||'')+'</div></div>'+(r.status==='pending'?'<div class="actions"><button class="primary" data-decision="approved" data-id="'+r.id+'">APPROVA</button><button class="danger" data-decision="rejected" data-id="'+r.id+'">RIFIUTA</button></div>':'')+'</div>').join(''):'<div class="muted">Nessuna richiesta.</div>'}document.addEventListener('click',async e=>{const b=e.target.closest('[data-decision]');if(!b)return;let reason='';if(b.dataset.decision==='rejected')reason=prompt('Motivo del rifiuto:')||'';const {error}=await sb.rpc('decide_championship_roster_player',{p_player_id:b.dataset.id,p_decision:b.dataset.decision,p_reason:reason});if(error)alert(error.message);else loadRoster()});(async()=>{try{await teamInfo();const {data}=await sb.auth.getSession();if(data.session)await claim();else login()}catch(e){document.getElementById('app').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>

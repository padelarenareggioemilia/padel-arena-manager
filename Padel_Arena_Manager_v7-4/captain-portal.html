const invite=new URLSearchParams(location.search).get("invite")||"";
const preview=new URLSearchParams(location.search).get("preview")==="1";
let team=DEMO_TEAMS.find(t=>t.inviteToken===invite)||null;
let session=null;
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function seriesLogo(series){const k=String(series||'').toLowerCase();return k.includes('serie a')?'assets/aics-serie-a-2027.png':k.includes('serie b')?'assets/aics-serie-b-2027.png':'assets/aics-serie-c-2027.png'}
function competitionGallery(){return '<section class="card"><h2>Competizioni AICS Padel 2027</h2><div class="competition-grid"><article><img src="assets/aics-serie-a-2027.png"><b>Serie A</b></article><article><img src="assets/aics-serie-b-2027.png"><b>Serie B</b></article><article><img src="assets/aics-serie-c-2027.png"><b>Serie C</b></article><article><img src="assets/aics-coppa-italia-2027.png"><b>Coppa Italia</b></article><article><img src="assets/aics-supercoppa-2027.png"><b>Supercoppa</b></article></div></section>'}

function loginView(message=""){
 if(!team){document.getElementById("app").innerHTML='<div class="card error">Link squadra non valido.</div>';return}
 document.getElementById("app").innerHTML='<section class="card series-hero"><img src="'+seriesLogo(team.series)+'" alt="'+esc(team.series)+'"><div><span class="pill">'+esc(team.series)+'</span><h2 style="margin-top:12px">'+esc(team.teamName)+'</h2><div class="muted">'+esc(team.clubLegalName)+'</div></div></section>'+competitionGallery()+
 '<section class="card"><h2>Accesso del capitano</h2><div class="notice">Crea o usa il tuo account con l’indirizzo email indicato dall’organizzazione: <b>'+esc(team.captainEmail)+'</b>.</div>'+
 '<label>Email</label><input id="email" type="email" value="'+esc(team.captainEmail)+'"><label>Password</label><input id="password" type="password" minlength="8">'+
 '<div class="actions"><button class="primary" id="login">Accedi</button><button class="secondary" id="signup">Crea account</button></div><div id="msg" class="notice '+(message?"error":"hidden")+'">'+esc(message)+'</div></section>';
 document.getElementById("login").onclick=login;
 document.getElementById("signup").onclick=signup;
}
async function login(){
 const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error)return loginView(error.message);
 session=data.session;await claimAndLoad();
}
async function signup(){
 const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;
 if(email!==team.captainEmail.toLowerCase())return loginView("Devi utilizzare l’email del referente già registrata.");
 const {data,error}=await sb.auth.signUp({email,password});
 if(error)return loginView(error.message);
 if(!data.session)return loginView("Account creato. Controlla l’email per confermare, poi accedi.");
 session=data.session;await claimAndLoad();
}
async function claimAndLoad(){
 if(preview){renderPortal();setTimeout(loadRoster,20);return}
 const {data,error}=await sb.rpc("claim_championship_team_invite",{p_token:invite});
 if(error){loginView("Accesso non ancora autorizzato oppure configurazione Supabase da completare: "+error.message);return}
 if(!data?.access_enabled){loginView("L’organizzazione non ha ancora aperto l’accesso a questa squadra.");return}
 team=Object.assign(team,data.team||{});renderPortal();await loadRoster();
}
function renderPortal(){
 document.getElementById("app").innerHTML='<section class="card series-hero"><img src="'+seriesLogo(team.series)+'" alt="'+esc(team.series)+'"><div><span class="pill">'+esc(team.series)+'</span><h2 style="margin-top:12px">'+esc(team.teamName)+'</h2><div class="muted">'+esc(team.clubLegalName)+'</div></div><button class="secondary" id="logout">Esci</button></section>'+competitionGallery()+
 '<section class="card"><h2>Logo della squadra</h2><div class="team-logo-box"><img id="teamLogoPreview" src="'+esc(team.teamLogoUrl||team.team_logo_url||'assets/padel-arena-manager-logo.jpg')+'" alt="Logo squadra"><div><label class="upload-label">Carica o sostituisci logo<input id="teamLogoInput" type="file" accept="image/*"></label><div class="muted" style="margin-top:8px">Usa preferibilmente un file quadrato PNG o JPG. Il logo sarà visibile nella scheda ufficiale della squadra.</div></div></div></section>'+
 '<section class="card"><h2>Dati già compilati</h2><div class="notice success">Non devi ricompilare i dati della squadra. Controllali e segnala all’organizzazione eventuali correzioni.</div><div class="grid">'+
 datum("Capitano",team.captainName)+datum("Email",team.captainEmail)+datum("Telefono",team.captainPhone)+datum("Campo di casa",team.homeCourtAddress)+datum("Giorno",team.homeDay)+datum("Orario",team.homeTime)+'</div></section>'+
 '<section class="card"><h2>Rosa giocatori</h2><div class="notice success"><b>Puoi lavorare sulla tua squadra in due modi:</b><br>inserire personalmente un giocatore oppure inviargli il link della squadra, così potrà compilare i dati in autonomia.</div><div id="roster"><div class="muted">Nessun giocatore inserito.</div></div><div class="actions"><button class="primary" id="addPlayer">Inserisci giocatore</button><button class="secondary" id="sharePlayerLink">Invia link ai giocatori</button><button class="secondary" id="copyPlayerLink">Copia link</button></div><div class="notice"><b>Cosa riceverà il giocatore:</b> link personale della squadra, istruzioni per compilare i dati, caricare una foto riconoscibile, accettare privacy e regolamento e inviare la richiesta. La richiesta resterà in attesa della tua approvazione e di quella dell’organizzazione.</div></section>';
 document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();loginView()};
 const playerUrl=new URL('player-registration.html?team='+encodeURIComponent((team.playerInviteToken||team.player_invite_token||team.inviteToken+'player')),location.href).href;
 const playerMessage=`Ciao! Sei stato invitato a inserirti nella rosa di ${team.teamName} per l’AICS Padel Championship 2027.\n\nApri il link:\n${playerUrl}\n\nCompila i tuoi dati, carica una foto riconoscibile, accetta privacy e regolamento e invia la richiesta. La tua registrazione resterà in attesa di approvazione del capitano e dell’organizzazione. Tessera AICS e certificato medico potranno essere completati successivamente.`;
 document.getElementById('addPlayer').onclick=()=>location.href=playerUrl+'&mode=captain';
 document.getElementById('sharePlayerLink').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Invito rosa '+team.teamName,text:playerMessage});else{await navigator.clipboard.writeText(playerMessage);alert('Messaggio e link copiati.')}}catch(e){if(e.name!=='AbortError')prompt('Copia il messaggio:',playerMessage)}};
 document.getElementById('copyPlayerLink').onclick=async()=>{await navigator.clipboard.writeText(playerUrl);alert('Link copiato.');};
 const logoInput=document.getElementById('teamLogoInput');
 logoInput.onchange=async()=>{
  const file=logoInput.files&&logoInput.files[0];if(!file)return;
  if(file.size>2500000){alert('Il logo supera 2,5 MB. Scegli un file più leggero.');logoInput.value='';return}
  const reader=new FileReader();reader.onload=async()=>{
   const value=String(reader.result||'');team.teamLogoUrl=value;team.team_logo_url=value;document.getElementById('teamLogoPreview').src=value;
   try{const {error}=await sb.from('championship_teams').update({team_logo_url:value,updated_at:new Date().toISOString()}).eq('id',team.id);if(error)throw error;alert('Logo squadra salvato.')}catch(e){localStorage.setItem('pam_team_logo_'+team.id,value);alert('Logo salvato sul dispositivo. Per sincronizzarlo online esegui lo script Supabase aggiornato.');}
  };reader.readAsDataURL(file);
 };
}
function datum(label,value){return '<div class="datum"><b>'+esc(label)+'</b><span>'+esc(value||"—")+'</span></div>'}
(async function(){
 const {data}=await sb.auth.getSession();session=data.session;
 if(preview){renderPortal();setTimeout(loadRoster,20);return}
 if(session)await claimAndLoad();else loginView();
})();

let CAPTAIN_ROSTER=[];
function rosterStatusLabel(v){return v==='approved'?'APPROVATO':v==='rejected'?'RIFIUTATO':'IN ATTESA'}
async function loadRoster(){
 const box=document.getElementById('roster');if(!box)return;
 if(preview&&!session){box.innerHTML='<div class="notice">Anteprima: accedendo come capitano qui compariranno le richieste reali.</div>';return}
 box.innerHTML='<div class="muted">Caricamento richieste...</div>';
 const {data,error}=await sb.from('championship_roster_players').select('*').eq('team_id',team.id).order('created_at',{ascending:false});
 if(error){box.innerHTML='<div class="notice error">Non posso caricare la rosa: '+esc(error.message)+'</div>';return}
 CAPTAIN_ROSTER=data||[];renderRoster();
}
function renderRoster(){
 const box=document.getElementById('roster');if(!box)return;
 const pending=CAPTAIN_ROSTER.filter(r=>r.approval_status==='pending').length,approved=CAPTAIN_ROSTER.filter(r=>r.approval_status==='approved').length;
 let html='<div class="notice '+(pending?'error':'success')+'"><b>'+pending+' richieste in attesa</b> · '+approved+' giocatori approvati</div>';
 if(!CAPTAIN_ROSTER.length){box.innerHTML=html+'<div class="muted">Nessun giocatore inserito.</div>';return}
 html+='<div class="roster-list">'+CAPTAIN_ROSTER.map(r=>'<div class="roster-row"><img src="'+esc(r.photo_url||'assets/padel-arena-manager-logo.jpg')+'"><div><b>'+esc((r.first_name||'')+' '+(r.last_name||''))+'</b><small>'+esc(r.email||'')+' · '+esc(r.phone||'')+'</small><small class="status-'+esc(r.approval_status||'pending')+'"><b>'+rosterStatusLabel(r.approval_status)+'</b>'+(r.rejection_reason?' · '+esc(r.rejection_reason):'')+'</small></div><div class="decision-actions">'+(r.approval_status==='pending'?'<button class="primary" data-cap-approve="'+r.id+'">Approva</button><button class="danger" data-cap-reject="'+r.id+'">Rifiuta</button>':'')+'</div></div>').join('')+'</div>';
 box.innerHTML=html;
}
async function decideRoster(id,decision){
 let reason=null;if(decision==='rejected'){reason=prompt('Motivo del rifiuto:','Dati da correggere');if(reason===null)return}
 const {error}=await sb.rpc('decide_championship_roster_player',{p_player_id:id,p_decision:decision,p_reason:reason});
 if(error){alert('Errore: '+error.message);return}await loadRoster();alert(decision==='approved'?'Giocatore approvato.':'Richiesta rifiutata: il giocatore potrà inviarla di nuovo.');
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-cap-approve]'),r=e.target.closest('[data-cap-reject]');if(a)decideRoster(a.getAttribute('data-cap-approve'),'approved');if(r)decideRoster(r.getAttribute('data-cap-reject'),'rejected')});
</script>

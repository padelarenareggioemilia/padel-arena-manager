<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Inserimento giocatore · Padel Arena Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#07111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25;--blue:#16a8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto;padding:18px 14px 60px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:15px}.brand img{width:66px;height:66px;border-radius:18px}.brand h1{margin:0;font-size:23px}.brand small,.muted{color:var(--muted)}.card{background:rgba(16,35,59,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 16px 44px rgba(0,0,0,.22)}h2,h3{margin:0 0 12px}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0;line-height:1.45}.success{border-color:#4ade80;background:#0b2a20}.error{border-color:#ef4444;background:#351316}label{display:block;font-weight:800;font-size:13px;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #365474;background:#071523;color:white}button{width:100%;padding:14px;border:0;border-radius:13px;font-weight:950;cursor:pointer}.primary{background:var(--accent);color:#07111f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.check input{width:auto;margin-top:4px}.required{color:#ff8585}.photo-preview{width:110px;height:110px;object-fit:cover;border-radius:18px;background:#fff;display:none;margin-top:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}
.competition-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.competition-grid article{background:#fff;border-radius:14px;padding:6px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}.competition-grid img{width:100%;height:96px;object-fit:contain}.competition-grid b{color:#0b2345;font-size:10px;text-transform:uppercase}.team-title{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}.team-title>img{width:80px;height:90px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}@media(max-width:650px){.competition-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><div class="brand"><img src="assets/padel-arena-manager-logo.jpg" alt=""><div><h1>Padel Arena Manager</h1><small>ROSA AICS PADEL CHAMPIONSHIP 2027</small></div></div><div id="app"><div class="card">Verifica del link in corso...</div></div></main><script>
const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});const token=new URLSearchParams(location.search).get('team');let team=null;const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
function seriesLogo(series){const k=String(series||'').toLowerCase();return k.includes('serie a')?'assets/aics-serie-a-2027.png':k.includes('serie b')?'assets/aics-serie-b-2027.png':'assets/aics-serie-c-2027.png'}function competitionGallery(){return `<section class="card"><h3>Competizioni AICS Padel 2027</h3><div class="competition-grid"><article><img src="assets/aics-serie-a-2027.png"><b>Serie A</b></article><article><img src="assets/aics-serie-b-2027.png"><b>Serie B</b></article><article><img src="assets/aics-serie-c-2027.png"><b>Serie C</b></article><article><img src="assets/aics-coppa-italia-2027.png"><b>Coppa Italia</b></article><article><img src="assets/aics-supercoppa-2027.png"><b>Supercoppa</b></article></div></section>`}async function load(){if(!token)return fail('Link non valido.');const {data,error}=await sb.rpc('public_championship_team_for_roster',{p_token:token});if(error||!data)return fail(error?.message||'Link non valido o non ancora attivo.');team=data;render()}
function fail(m){document.getElementById('app').innerHTML='<div class="card error">'+esc(m)+'</div>'}
function render(){document.getElementById('app').innerHTML=`<section class="card team-title"><img src="${seriesLogo(team.series)}" alt="${esc(team.series||'')}"><div><h2>${esc(team.team_name)}</h2><div class="muted">${esc(team.club_legal_name||'')} · ${esc(team.series||'')}</div></div><div class="notice success"><b>Sei nel link corretto della tua squadra.</b><br>I dati inviati saranno visibili soltanto al capitano e all'organizzazione.</div></section>${competitionGallery()}<section class="card"><h3>Cosa devi fare</h3><div class="notice">1. Compila tutti i campi obbligatori.<br>2. Carica una foto recente e riconoscibile.<br>3. Accetta privacy e regolamento.<br>4. Premi <b>Invia richiesta</b>.<br><br>La richiesta non rende subito schierabili: dovrà essere approvata. Tessera AICS e certificato medico saranno verificati successivamente.</div></section><form id="f" class="card"><div class="row"><div><label>Nome <span class="required">*</span></label><input name="first_name" required></div><div><label>Cognome <span class="required">*</span></label><input name="last_name" required></div></div><div class="row"><div><label>Data di nascita <span class="required">*</span></label><input name="birth_date" type="date" required></div><div><label>Luogo di nascita <span class="required">*</span></label><input name="birth_place" required></div></div><div class="row"><div><label>CAP <span class="required">*</span></label><input name="postal_code" inputmode="numeric" required></div><div><label>Comune di residenza <span class="required">*</span></label><input name="residence_town" required></div></div><div class="row"><div><label>Provincia <span class="required">*</span></label><input name="residence_province" maxlength="2" required placeholder="RE"></div><div><label>Telefono <span class="required">*</span></label><input name="phone" type="tel" required></div></div><label>Email <span class="required">*</span></label><input name="email" type="email" required><label>Foto riconoscibile <span class="required">*</span></label><input id="photo" type="file" accept="image/*" required><img id="preview" class="photo-preview" alt="Anteprima"><label class="check"><input name="privacy" type="checkbox" required><span>Accetto il trattamento dei dati personali per la gestione del campionato.</span></label><label class="check"><input name="regulation" type="checkbox" required><span>Dichiaro di aver letto e accettato il regolamento AICS Padel Championship 2027.</span></label><button class="primary" id="submit">Invia richiesta</button><div id="msg"></div></form>`;document.getElementById('photo').onchange=e=>{const f=e.target.files[0],im=document.getElementById('preview');if(f){im.src=URL.createObjectURL(f);im.style.display='block'}};document.getElementById('f').onsubmit=submit}
async function submit(e){e.preventDefault();const b=document.getElementById('submit'),msg=document.getElementById('msg');b.disabled=true;b.textContent='Invio in corso...';msg.innerHTML='';try{const fd=new FormData(e.target),photo=document.getElementById('photo').files[0];if(photo&&photo.size>2*1024*1024)throw new Error('La foto supera 2 MB. Riducila e riprova.');const photoData=photo?await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Impossibile leggere la foto.'));r.readAsDataURL(photo)}):'';const payload={first_name:fd.get('first_name').trim(),last_name:fd.get('last_name').trim(),birth_date:fd.get('birth_date'),birth_place:fd.get('birth_place').trim(),postal_code:fd.get('postal_code').trim(),residence_town:fd.get('residence_town').trim(),residence_province:fd.get('residence_province').trim().toUpperCase(),phone:fd.get('phone').trim(),email:fd.get('email').trim(),photo_name:photo?.name||'',photo_type:photo?.type||'',photo_data:photoData};const {data,error}=await sb.rpc('submit_public_championship_roster_player',{p_token:token,p_player:payload});if(error)throw error;document.getElementById('app').innerHTML=`<div class="card success"><h2>Richiesta inviata</h2><p>Grazie ${esc(payload.first_name)}. La richiesta per <b>${esc(team.team_name)}</b> è stata registrata. Il capitano vedrà subito una notifica nella propria area squadra.</p><div class="notice">Il capitano e l'organizzazione dovranno approvarla. Riceverai indicazioni successive per pagamento della tessera AICS, certificato medico e completamento definitivo.</div></div>`}catch(err){msg.innerHTML='<div class="notice error">'+esc(err.message||'Errore durante l’invio.')+'</div>';b.disabled=false;b.textContent='Invia richiesta'}}
load();
</script></body></html>

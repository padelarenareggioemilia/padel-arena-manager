<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Crea profilo giocatore · Padel Arena</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#06101d;--card:#10233b;--line:#315174;--text:#f8fafc;--muted:#adc0d3;--lime:#9dff25;--red:#ff5364}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#164967,transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:16px 14px 60px}.brand{display:flex;gap:13px;align-items:center;margin:8px 0 18px}.brand img{width:72px;height:72px;border-radius:19px;object-fit:cover}.brand h1{margin:0}.muted{color:var(--muted)}.card{background:#10233bf2;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.notice{border:1px solid var(--line);border-radius:14px;padding:13px;background:#08192b;margin:10px 0}.success{border-color:#4ade80;background:#0b2b21}.error{border-color:var(--red);background:#35131a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:900;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border:1px solid #406489;border-radius:12px;background:#071523;color:#fff}textarea{min-height:90px}button,.button{display:block;width:100%;padding:14px;border:0;border-radius:13px;background:var(--lime);color:#07111f;text-align:center;text-decoration:none;font-weight:950;margin-top:12px}.secondary{background:#183856;color:#fff;border:1px solid #41678c}.hidden{display:none!important}@media(max-width:640px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="brand"><img src="assets/padel-arena-manager-logo.png" alt=""><div><h1>Padel Arena Manager</h1><div class="muted">CREA LA TUA ANAGRAFICA GIOCATORE</div></div></div><div id="app"><div class="card">Verifica dell’invito…</div></div></main><script>
const URL_SB="https://zxubwvtngyfebtfnvnwg.supabase.co",KEY_SB="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";
const sb=supabase.createClient(URL_SB,KEY_SB,{auth:{persistSession:true,detectSessionInUrl:true}}),token=new URLSearchParams(location.search).get('invite')||localStorage.getItem('pam_player_invite')||'';let invite=null;
const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
function message(t,bad=false){const x=document.getElementById('msg');if(x){x.className='notice '+(bad?'error':'success');x.textContent=t}}
function itError(e){const m=String(e?.message||e||'Errore sconosciuto');if(/user already registered|already been registered/i.test(m))return 'Esiste già un account con questo indirizzo email. Usa “Ho già un account” oppure recupera la password.';if(/password/i.test(m)&&/least|characters|weak/i.test(m))return 'La password non rispetta i requisiti di sicurezza.';if(/rate limit|too many requests/i.test(m))return 'Hai effettuato troppi tentativi. Attendi qualche minuto e riprova.';return m}
async function load(){if(!token)return fail('Link di invito mancante.');localStorage.setItem('pam_player_invite',token);const r=await sb.rpc('public_player_invite',{p_token:token});if(r.error||!r.data)return fail(r.error?.message||'Invito non valido o non più attivo.');invite=r.data;render();const s=await sb.auth.getSession();if(s.data.session)claimSaved()}
function fail(t){document.getElementById('app').innerHTML='<div class="card error"><h2>Non posso aprire l’invito</h2><p>'+esc(t)+'</p></div>'}
function render(){const scope=invite.scope==='event'?'<div class="notice success"><b>ACCESSO AL SINGOLO EVENTO</b><br>'+esc(invite.event_name||'Evento')+(invite.event_date?' · '+esc(invite.event_date):'')+(invite.club?' · '+esc(invite.club):'')+'<br><span class="muted">Dopo la registrazione vedrai soltanto questo evento.</span></div>':'<div class="notice success"><b>ACCESSO GIOCATORE ALLA PIATTAFORMA</b><br>Potrai esplorare tornei ed eventi pubblicati, mantenendo i soli permessi di un giocatore.</div>';
document.getElementById('app').innerHTML='<section class="card"><h2>Invito personale</h2>'+scope+'<div class="notice">I tuoi dati saranno visibili all’organizzazione. Non avrai accesso a comandi amministrativi o ai dati riservati degli altri giocatori.</div></section><form id="f" class="card"><h2>1. La tua anagrafica</h2><div class="row"><div><label>Nome *</label><input name="firstName" required></div><div><label>Cognome *</label><input name="lastName" required></div></div><div class="row"><div><label>Data di nascita *</label><input name="birth" type="date" required></div><div><label>Luogo di nascita</label><input name="birthPlace"></div></div><div class="row"><div><label>Telefono *</label><input name="phone" type="tel" required></div><div><label>Sesso</label><select name="gender"><option>Maschile</option><option>Femminile</option><option>Altro / preferisco non indicarlo</option></select></div></div><div class="row"><div><label>Comune di residenza</label><input name="residenceTown"></div><div><label>Provincia</label><input name="residenceProvince" maxlength="2"></div></div><div class="row"><div><label>Livello / categoria</label><input name="level"></div><div><label>Tessera AICS</label><select name="aicsCard"><option value="yes">Sì</option><option value="no">No</option><option value="unknown">Non so</option></select></div></div><h2>2. Il tuo accesso</h2><label>Email *</label><input name="email" type="email" required><label>Crea password (almeno 8 caratteri) *</label><input name="password" type="password" minlength="8" required><label><input name="privacy" type="checkbox" style="width:auto" required> Accetto il trattamento dei dati per la gestione sportiva.</label><button id="send" type="submit">CREA PROFILO GIOCATORE</button><div id="msg"></div></form><div class="card"><a class="button secondary" href="player-portal.html">HO GIÀ UN ACCOUNT · ACCEDI</a></div>';
document.getElementById('f').onsubmit=signup}
function formPayload(f){const d=new FormData(f);return{firstName:String(d.get('firstName')||'').trim(),lastName:String(d.get('lastName')||'').trim(),birth:d.get('birth'),birthPlace:String(d.get('birthPlace')||'').trim(),phone:String(d.get('phone')||'').trim(),gender:d.get('gender'),residenceTown:String(d.get('residenceTown')||'').trim(),residenceProvince:String(d.get('residenceProvince')||'').trim().toUpperCase(),level:String(d.get('level')||'').trim(),aicsCard:d.get('aicsCard')}}
async function signup(e){e.preventDefault();const f=e.target,email=f.email.value.trim().toLowerCase(),password=f.password.value,payload=formPayload(f);if(password.length<8)return message('La password deve contenere almeno 8 caratteri.',true);localStorage.setItem('pam_player_profile_pending',JSON.stringify(payload));const redirect=new URL('player-invite.html?invite='+encodeURIComponent(token)+'&confirmed=1',location.href).href;const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirect,data:{display_name:payload.firstName+' '+payload.lastName,account_type:'player'}}});if(r.error)return message(itError(r.error),true);if(r.data.session)return claimSaved();message('Ti abbiamo inviato un’email in italiano. Aprila e premi “CONFERMA IL MIO ACCOUNT”. Controlla anche la cartella spam.')}
async function claimSaved(){let payload={};try{payload=JSON.parse(localStorage.getItem('pam_player_profile_pending')||'{}')}catch(_){ }if(!payload.firstName)return message('Account attivo. Compila l’anagrafica e premi il pulsante per collegarla.');const r=await sb.rpc('claim_player_invite',{p_token:token,p_payload:payload});if(r.error)return message(r.error.message,true);localStorage.removeItem('pam_player_profile_pending');location.href='player-portal.html'}
load();
</script></body></html>

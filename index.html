*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1729);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:18px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#07111f;display:grid;place-items:center;font-weight:1000}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{min-height:120px;border:1px solid var(--line);background:#13233b;color:#fff;border-radius:18px;padding:16px;text-align:left}.action b{display:block;margin-top:14px;font-size:17px}.action span{font-size:12px;color:var(--muted)}
.primary,.secondary,.danger,.small,.back{border:0;border-radius:12px;font-weight:900}.primary{width:100%;padding:14px;background:var(--accent);color:#07111f}.secondary,.small,.back{background:#203754;color:#fff;padding:10px 12px}.danger{background:var(--danger);color:#240b13;padding:10px 12px}.primary:disabled{opacity:.55}
.row{display:flex;gap:10px}.row>*{flex:1}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#091729;color:#fff;outline:none}textarea{min-height:86px;resize:vertical}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.grow{flex:1}.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#203754;font-weight:900}.pill{padding:5px 8px;border-radius:999px;background:#203754;color:var(--aqua);font-size:11px;font-weight:900}

.error{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.12);color:#ffdbe2}.success{border-color:rgba(183,255,60,.35);background:rgba(183,255,60,.09);color:#efffd5}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}

.timer-panel{
 margin:16px 0;
 padding:20px;
 border:4px solid #111827;
 border-radius:20px;
 text-align:center;
 background:#f8fafc;
 box-shadow:0 10px 28px rgba(0,0,0,.22);
}
.timer-panel.running{
 border-color:#f59e0b;
 background:#fff7ed;
}
.timer-panel.expired{
 border-color:#dc2626;
 background:#fee2e2;
 animation:timerFlash .55s infinite alternate;
}
.timer-title{
 font-size:16px;
 font-weight:900;
 text-transform:uppercase;
 letter-spacing:1.2px;
}
.timer-display{
 display:block;
 margin:10px 0 14px;
 font-size:clamp(64px,12vw,120px);
 line-height:1;
 font-weight:1000;
 font-variant-numeric:tabular-nums;
 color:#111827;
}
.timer-panel.expired .timer-display{
 color:#b91c1c;
}
.timer-alert-overlay{
 position:fixed;
 inset:0;
 z-index:99999;
 display:none;
 align-items:center;
 justify-content:center;
 padding:24px;
 background:rgba(185,28,28,.93);
 animation:overlayPulse .55s infinite alternate;
}
.timer-alert-overlay.visible{display:flex}
.timer-alert-box{
 width:min(720px,94vw);
 padding:34px 24px;
 border:6px solid #fff;
 border-radius:24px;
 text-align:center;
 background:#111827;
 color:#fff;
 box-shadow:0 24px 80px rgba(0,0,0,.55);
}
.timer-alert-box h1{
 margin:0 0 14px;
 font-size:clamp(44px,10vw,96px);
 line-height:1;
}
.timer-alert-box p{
 margin:0 0 24px;
 font-size:clamp(20px,4vw,34px);
 font-weight:800;
}
@keyframes timerFlash{
 from{transform:scale(1);box-shadow:0 0 0 rgba(220,38,38,0)}
 to{transform:scale(1.015);box-shadow:0 0 34px rgba(220,38,38,.8)}
}
@keyframes overlayPulse{
 from{background:rgba(185,28,28,.88)}
 to{background:rgba(239,68,68,.98)}
}

function buildMatches(ids,courts,returnLeg){
 const playerIds=(ids||[]).slice();
 if(playerIds.length<4)throw new Error("servono almeno 4 giocatori per generare le partite");
 courts=Math.max(1,Number(courts)||1);

 const candidates=[];
 const seen=new Set();

 for(let a=0;a<playerIds.length-3;a++){
  for(let b=a+1;b<playerIds.length-2;b++){
   for(let c=b+1;c<playerIds.length-1;c++){
    for(let d=c+1;d<playerIds.length;d++){
     const q=[playerIds[a],playerIds[b],playerIds[c],playerIds[d]];
     [
      [[q[0],q[1]],[q[2],q[3]]],
      [[q[0],q[2]],[q[1],q[3]]],
      [[q[0],q[3]],[q[1],q[2]]]
     ].forEach(function(pairing){
      const t1=pairing[0].slice(),t2=pairing[1].slice();
      const key=[t1.slice().sort().join("-"),t2.slice().sort().join("-")].sort().join("|");
      if(seen.has(key))return;
      seen.add(key);
      candidates.push({
       id:uid("m"),round:0,leg:1,court:1,
       t1:t1,t2:t2,score1:null,score2:null,note:""
      });
     });
    }
   }
  }
 }

 const targetByPlayers={6:6,8:8,10:10,12:12,16:16};
 const target=Math.min(candidates.length,targetByPlayers[playerIds.length]||Math.max(4,playerIds.length));
 const appearances={};
 playerIds.forEach(function(id){appearances[id]=0});
 const selected=[];

 while(selected.length<target){
  let bestIndex=-1,bestScore=Infinity;
  candidates.forEach(function(m,index){
   if(m._used)return;
   const score=m.t1.concat(m.t2).reduce(function(sum,id){return sum+appearances[id]},0);
   if(score<bestScore){bestScore=score;bestIndex=index}
  });
  if(bestIndex<0)break;
  const match=candidates[bestIndex];
  match._used=true;
  match.t1.concat(match.t2).forEach(function(id){appearances[id]++});
  selected.push(match);
 }

 selected.forEach(function(m,index){
  delete m._used;
  m.round=Math.floor(index/courts)+1;
  m.court=(index%courts)+1;
 });

 if(returnLeg){
  selected.slice().forEach(function(m,index){
   selected.push({
    id:uid("m"),round:m.round,leg:2,court:(index%courts)+1,
    t1:m.t2.slice(),t2:m.t1.slice(),
    score1:null,score2:null,note:""
   });
  });
 }

 if(!selected.length)throw new Error("non è stato possibile generare il calendario");
 return selected;
}

function buildFixedPairs(ids,pairsPerGroup,courts,returnLeg){
 const pairs=[];
 for(let i=0;i+1<ids.length;i+=2)pairs.push({id:uid("pair"),players:[ids[i],ids[i+1]],name:"Coppia "+(pairs.length+1),group:null});
 const groupCount=Math.max(1,Math.ceil(pairs.length/Math.max(2,pairsPerGroup)));
 pairs.forEach(function(pair,i){pair.group=String.fromCharCode(65+(i%groupCount))});
 const matches=[];
 const groups={};
 pairs.forEach(function(p){(groups[p.group]||(groups[p.group]=[])).push(p)});
 Object.keys(groups).forEach(function(g){
  const gp=groups[g];
  for(let i=0;i<gp.length;i++){
   for(let j=i+1;j<gp.length;j++){
    matches.push({id:uid("m"),round:g,leg:1,court:(matches.length%courts)+1,pair1:gp[i].id,pair2:gp[j].id,score1:null,score2:null,note:"",group:g});
   }
  }
 });
 if(returnLeg){
  const firstLeg=matches.slice();
  firstLeg.forEach(function(m){
   matches.push({id:uid("m"),round:m.round,leg:2,court:(matches.length%courts)+1,pair1:m.pair2,pair2:m.pair1,score1:null,score2:null,note:"",group:m.group});
  });
 }
 return {pairs:pairs,matches:matches};
}

 return out;
}

function phaseFormula(e,phase){
 if(phase==="Eliminatoria")return e.eliminationReturnLeg?"Andata e ritorno":"Solo andata";
 if(phase.indexOf("Semifinale")===0)return e.semifinalReturnLeg?"Andata e ritorno":"Solo andata";
 if(phase==="Finale")return e.finalReturnLeg?"Andata e ritorno":"Solo andata";
 return e.returnLeg?"Andata e ritorno":"Solo andata";
}
function scheduleInfo(e,index,phase,court){
 const dateText=e.date||new Date().toISOString().slice(0,10);
 const timeText=e.startTime||"20:00";
 const parts=timeText.split(":");
 const base=new Date(dateText+"T"+timeText+":00");
 const duration=Math.max(1,Number(e.matchDuration)||20);
 const slot=Math.floor(index/Math.max(1,Number(e.courts)||1));
 base.setMinutes(base.getMinutes()+slot*duration);
 const day=base.toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"});
 const hour=base.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
 return {day:day,hour:hour,court:court||((index%Math.max(1,Number(e.courts)||1))+1),phase:phase};
}

}
function timerEnabledForPhase(e,phase){
 if(phase==="initial")return e.initialTimerEnabled!==false;
 if(phase==="elimination")return !!e.eliminationTimerEnabled;
 if(phase==="semifinal")return !!e.semifinalTimerEnabled;
 if(phase==="final")return !!e.finalTimerEnabled;
 return false;
}
function timerHtml(e,key,phase){

 e.timers=e.timers||{};
 const t=e.timers[key]||{};
 const remaining=t.endAt?Math.max(0,t.endAt-Date.now()):(Number(e.matchDuration)||20)*60000;
 const status=t.endAt?(remaining<=0?"expired":"running"):"";
 return '<div class="timer-panel '+status+'" data-timer-panel="'+esc(key)+'">'+
  '<div class="timer-title">'+(remaining<=0&&t.endAt?"TEMPO TERMINATO":"CONTO ALLA ROVESCIA")+'</div>'+
  '<span class="timer-display" data-timer-display="'+esc(key)+'">'+formatRemaining(remaining)+'</span>'+
  '<button class="primary" data-action="start-timer" data-timer-key="'+esc(key)+'">'+(t.endAt?"Ricomincia partita":"Inizia partita")+'</button> '+
  '<button class="secondary" data-action="reset-timer" data-timer-key="'+esc(key)+'">Azzera timer</button>'+
  '</div>';
}function formatRemaining(ms){
 const total=Math.max(0,Math.ceil(ms/1000));
 const min=Math.floor(total/60),sec=total%60;
 return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

let timerAudioContext=null;
function playTimerAlarm(){
 try{
  timerAudioContext=timerAudioContext||new (window.AudioContext||window.webkitAudioContext)();
  const ctx=timerAudioContext;
  const now=ctx.currentTime;
  [0,0.35,0.7,1.05,1.4].forEach(function(offset){
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();
   osc.type="square";
   osc.frequency.setValueAtTime(offset%0.7===0?880:660,now+offset);
   gain.gain.setValueAtTime(0.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(0.35,now+offset+0.02);
   gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.28);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(now+offset);osc.stop(now+offset+0.3);
  });
 }catch(err){}
 try{if(navigator.vibrate)navigator.vibrate([500,200,500,200,900])}catch(err){}
}
function showTimerAlert(key){
 const overlay=document.getElementById("timerAlertOverlay");

 playTimerAlarm();
}

function updateTimers(){
 const e=currentEvent();if(!e)return;
 e.timers=e.timers||{};
 let changed=false;
 document.querySelectorAll("[data-timer-display]").forEach(function(el){
  const key=el.getAttribute("data-timer-display");
  const t=e.timers[key];
  const panel=document.querySelector('[data-timer-panel="'+CSS.escape(key)+'"]');
  const ms=t&&t.endAt?Math.max(0,t.endAt-Date.now()):Math.max(1,Number(e.matchDuration)||20)*60000;
  el.textContent=ms<=0&&t&&t.endAt?"00:00":formatRemaining(ms);
  if(panel){
   panel.classList.toggle("running",!!(t&&t.endAt&&ms>0));
   panel.classList.toggle("expired",!!(t&&t.endAt&&ms<=0));
   const title=panel.querySelector(".timer-title");
   if(title)title.textContent=t&&t.endAt&&ms<=0?"TEMPO TERMINATO":"CONTO ALLA ROVESCIA";
  }
  if(t&&t.endAt&&ms<=0&&!t.alerted){
   t.alerted=true;
   changed=true;
   showTimerAlert(key);
  }
 });
 if(changed)save();
}

function standings(e){
 const r={};e.playerIds.forEach(function(id){r[id]={id:id,played:0,points:0,gf:0,gs:0,w:0,d:0,l:0}});
 e.matches.forEach(function(m){

  m.t1.concat(m.t2).forEach(function(id){r[id].played++});

   e.playerIds.forEach(function(id){e.ledger[id].podium=0});

 if(ev.target.matches("[data-ledger]")){

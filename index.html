  const [t,m,st,l]=await Promise.all([
   sb.rpc('public_upcoming_tournaments'),
   sb.rpc('public_championship_matches'),
   sb.rpc('public_championship_standings'),
   sb.rpc('public_championship_lineups')
  ]);
  PAM_PUBLIC_DATA.tournaments=t.error?[]:(t.data||[]);PAM_PUBLIC_DATA.matches=m.error?[]:(m.data||[]);PAM_PUBLIC_DATA.standings=st.error?[]:(st.data||[]);PAM_PUBLIC_DATA.lineups=l.error?[]:(l.data||[]);
  const events=document.getElementById('pamPublicTournaments');if(events)events.innerHTML=pamPublicUpcomingHtml();
  const count=document.getElementById('pamPublicTournamentCount');if(count)count.textContent=PAM_PUBLIC_DATA.tournaments.length+' EVENTI';
  pamRenderPublicChampContent();
  const liveToken=new URLSearchParams(location.search).get('live');
  if(liveToken&&PAM_PUBLIC_DATA.tournaments.some(function(x){return String(x.share_token)===String(liveToken)&&x.competition_type==='national_event'}))pamOpenPublicNationalLive(liveToken,'matches');
 }catch(err){console.error(err);const events=document.getElementById('pamPublicTournaments');if(events)events.innerHTML='<div class="pam-public-empty" style="grid-column:1/-1">Impossibile caricare momentaneamente gli eventi. Riprova tra poco.</div>';pamRenderPublicChampContent()}
}

function pamRepairEventPlayerIdsFromMatches(e){
 if(!e||typeof e!=="object")return 0;
 // Nei Campionati Nazionali le coppie confermate sono la fonte ufficiale.
 // Le partite possono appartenere a un calendario precedente e non devono

 if(e.nationalParentId||e.competitionType==="national_category")return 0;
 const before=JSON.stringify({playerIds:e.playerIds||[],ledger:e.ledger||{},payments:e.payments||{}});
 const oldIds=(e.playerIds||[]).filter(Boolean).map(String);
 const matchIds=[];const seenIds=new Set();
 (e.matches||[]).forEach(function(m){
  (m.t1||[]).concat(m.t2||[]).forEach(function(id){
   const key=String(id||"");if(key&&!seenIds.has(key)){seenIds.add(key);matchIds.push(key)}
  });
 });
 // Se esistono partite, sono l'unica fonte affidabile dei partecipanti reali.
 // Non importare mai chiavi residue di vecchi ledger, pagamenti o snapshot.
 const source=matchIds.length>=4?matchIds:oldIds;
 const repaired=[];const seenNames=new Set();
 source.forEach(function(id){
  const p=playerById(id),nameKey=p?registryTokenKey(playerName(p)):"id|"+id;
  if(seenNames.has(nameKey))return;
  seenNames.add(nameKey);repaired.push(String(id));
 });
 const oldLedger=e.ledger&&typeof e.ledger==="object"?e.ledger:{};
 const oldPayments=e.payments&&typeof e.payments==="object"?e.payments:{};
 const allOldKeys=Array.from(new Set(oldIds.concat(Object.keys(oldLedger),Object.keys(oldPayments))));
 const cleanLedger={},cleanPayments={};
 repaired.forEach(function(id){
  const p=playerById(id),nameKey=p?registryTokenKey(playerName(p)):"";
  const sameNameKeys=allOldKeys.filter(function(oldId){const op=playerById(oldId);return nameKey&&op&&registryTokenKey(playerName(op))===nameKey});
  const ledgers=[id].concat(sameNameKeys).map(function(k){return oldLedger[k]}).filter(Boolean);
  const base=oldLedger[id]||{};
  cleanLedger[id]={
   carried:Math.max(Number((p&&p.tokenBalance)||0),...ledgers.map(function(x){return Number(x.carried)||0})),
   spent:Number(base.spent)||0,podium:Number(base.podium)||0
  };
  const payment=oldPayments[id]||sameNameKeys.map(function(k){return oldPayments[k]}).find(function(x){return x&&x.paid})||{};
  cleanPayments[id]={fee:Number(payment.fee!==undefined?payment.fee:e.entryFee)||0,paid:!!payment.paid,method:payment.method||"",notes:payment.notes||""};
 });
 e.playerIds=repaired;e.ledger=cleanLedger;e.payments=cleanPayments;
 const after=JSON.stringify({playerIds:e.playerIds,ledger:e.ledger,payments:e.payments});

 function modalPlayersV8227(){
  const all=(state.players||[]).slice();
  const existingIds=new Set(all.map(function(p){return String(p.id)}));

  // IMPORTANT: a participant can still exist inside the tournament snapshot
  // even if the shared registry has temporarily loaded a different/incomplete record set.
  // Always surface those selected tournament participants in this modal.
  selected.forEach(function(pid){
   if(existingIds.has(String(pid)))return;
   const snap=(e.playerSnapshots&&e.playerSnapshots[String(pid)])||playerById(pid);
   if(!snap)return;
   const virtual=Object.assign({},snap,{id:String(pid),__pamTournamentSnapshot:true});
   all.push(virtual);
   existingIds.add(String(pid));
  });

  // One row per ID; selected snapshot ID is kept intact so results/matches are untouched.
  const byId=new Map();
  all.forEach(function(p){
   if(!p||p.id===undefined||p.id===null)return;
   byId.set(String(p.id),p);
  });
  return Array.from(byId.values());
 }

  if(ids.length<4)throw new Error("Seleziona almeno 4 giocatori.");

function normalizeText(value){
 return String(value||"")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g," ")
  .trim()
  .replace(/\s+/g," ");
}
function pamCanonicalPersonKeyV8233(name){

 const uniq=[];
 words.forEach(function(w){if(uniq.indexOf(w)<0)uniq.push(w)});
 return uniq.slice().sort().join(" ");
}
function pamCleanRepeatedPersonNameV8233(name){
 const raw=String(name||"").trim().split(/\s+/).filter(Boolean), seen=new Set(), out=[];
 raw.forEach(function(w){
  const k=normalizeText(w);
  if(k && !seen.has(k)){seen.add(k);out.push(w)}

}

 const ar=["phone","email","level","gender"].reduce(function(n,k){return n+(a[k]?1:0)},0);
 const br=["phone","email","level","gender"].reduce(function(n,k){return n+(b[k]?1:0)},0);
 return br>ar?b:a;
}
function pamMergeDuplicateRegistryV8233(){

  if(!groups.has(key)){
   // Clean repeated words even for the first occurrence.
   const cleaned=Object.assign({},p);
   const cleanName=pamCleanRepeatedPersonNameV8233(playerName(cleaned));
   if(cleaned.name!==undefined) cleaned.name=cleanName;
   else if(cleaned.fullName!==undefined) cleaned.fullName=cleanName;
   groups.set(key,cleaned); out.push(cleaned); idMap.set(String(p.id),String(cleaned.id)); return;
  }

  if(pamConflictV822(cur,p)){
   out.push(p); idMap.set(String(p.id),String(p.id)); return;
  }
  const preferred=pamPreferredDuplicateV8233(cur,p);
  const other=preferred===cur?p:cur;

  const cleanName=pamCleanRepeatedPersonNameV8233(playerName(preferred));

  idMap.set(oldCur,keep); idMap.set(oldP,keep);
 });
 idMap.forEach(function(v,k){
  let x=v,guard=0;
  while(idMap.has(x)&&idMap.get(x)!==x&&guard++<20)x=idMap.get(x);

 });

function pamCaptainPortalUrl(team,tokenOverride){
 const base=location.href.split("?")[0].replace(/index\.html?$/i,"").replace(/\/$/,"");
 const token=tokenOverride||team?.inviteToken||team?.invite_token||"";
 return base+"/captain-portal.html?invite="+encodeURIComponent(token);
}
async function pamPrepareCaptainPortal(team){
 if(!team)throw new Error("Squadra non trovata.");
 if(!pamIsAdmin()||!PAM_SESSION)throw new Error("Accedi come amministratore per preparare il portale capitano.");
 let token=String(team.inviteToken||team.invite_token||"").trim();
 if(!token)token=(crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):(Date.now().toString(16)+Math.random().toString(16).slice(2)));
 const lookup=await sb.from("championship_teams").select("id,invite_token,access_enabled").eq("id",team.id).maybeSingle();
 if(lookup.error)throw lookup.error;
 if(lookup.data){
  token=String(lookup.data.invite_token||token);
  const upd=await sb.from("championship_teams").update({invite_token:token,access_enabled:true,updated_at:new Date().toISOString()}).eq("id",team.id).select("id,invite_token").single();
  if(upd.error)throw upd.error;
  token=String(upd.data?.invite_token||token);
 }else{
  const row={id:team.id,team_name:team.teamName||"Squadra",series:team.series||"",club_legal_name:team.clubLegalName||"",club_tax_id:team.clubTaxId||"",club_address:team.clubAddress||"",club_postal_code:team.clubPostalCode||"",club_town:team.clubTown||"",club_province:team.clubProvince||"",club_phone:team.clubPhone||"",club_email:team.clubEmail||"",home_court_address:team.homeCourtAddress||"",home_day:team.homeDay||"",home_time:team.homeTime||"",captain_name:team.captainName||"",captain_email:team.captainEmail||"",captain_phone:team.captainPhone||"",access_enabled:true,invite_token:token,roster_status:team.rosterStatus||"Da compilare",status:team.status||"Iscritta",updated_at:new Date().toISOString()};
  const ins=await sb.from("championship_teams").insert(row).select("id,invite_token").single();
  if(ins.error)throw ins.error;
  token=String(ins.data?.invite_token||token);
 }
 pamSaveChampTeam(team.id,{inviteToken:token,captainAccessEnabled:true});
 team.inviteToken=token;team.captainAccessEnabled=true;
 return pamCaptainPortalUrl(team,token);
}

function pamTokenPersonKeyV8234(name){
 const words=String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().replace(/[^a-z0-9 ]/g," ").trim().split(/\s+/).filter(Boolean);
 const uniq=[];
 words.forEach(function(w){if(!uniq.includes(w))uniq.push(w)});
 return uniq.sort().join("|");
}
function pamTokenPersonIdsV8234(player){
 if(!player)return[];
 const key=pamTokenPersonKeyV8234(playerName(player));
 return (state.players||[]).filter(function(p){
  return pamTokenPersonKeyV8234(playerName(p))===key;
 }).map(function(p){return String(p.id)});
}
function pamLatestValidTokenFromEventsV8234(player){
 const ids=new Set(pamTokenPersonIdsV8234(player));
 if(!ids.size)return null;
 const events=(state.events||[]).filter(function(e){
  return e&&e.competitionType==="rodeo_tokens"&&(e.playerIds||[]).some(function(id){return ids.has(String(id))});
 }).sort(function(a,b){return pamEventTimeV8216(b)-pamEventTimeV8216(a)});

 for(let i=0;i<events.length;i++){
  const e=events[i];
  // Try every duplicate ID tied to the same real person.
  const eventIds=(e.playerIds||[]).filter(function(id){return ids.has(String(id))});
  for(let j=0;j<eventIds.length;j++){
   try{
    const exact=pamFinalTokenBalanceFromEventV8216(e,eventIds[j]);
    if(exact!==null && Number.isFinite(Number(exact))){
     return {balance:Math.max(0,Number(exact)||0),time:pamEventTimeV8216(e),event:e};
    }
   }catch(_){}
  }
 }
 return null;
}
function pamLatestTokenBalanceV8234(player){
 if(!player)return 0;
 const eventResult=pamLatestValidTokenFromEventsV8234(player);
 const key=pamTokenPersonKeyV8234(playerName(player));
 const certified=pamCertifiedTokenBalancesV8234()[key];

 // Certified values describe the latest verified snapshots supplied by the organizer.
 // If an event is chronologically later than those snapshots, its real final balance wins.
 // Current certified snapshots are dated 2026-08-24.
 const certifiedTime=new Date("2026-08-24T23:59:59+02:00").getTime();
 if(eventResult && eventResult.time>certifiedTime)return eventResult.balance;
 if(certified!==undefined)return Math.max(0,Number(certified)||0);
 if(eventResult)return eventResult.balance;

 // Final fallback: use the highest registry balance among duplicate records.
 const ids=new Set(pamTokenPersonIdsV8234(player));
 let fallback=0;
 (state.players||[]).forEach(function(p){
  if(ids.has(String(p.id)))fallback=Math.max(fallback,Math.max(0,Number(p.tokenBalance)||0));
 });
 return fallback;
}
function pamTokenRepresentativeV8234(group){
 return group.slice().sort(function(a,b){
  const ac=(a.phone?1:0)+(a.email?1:0)+(a.gender?1:0)+(a.level?1:0);
  const bc=(b.phone?1:0)+(b.email?1:0)+(b.gender?1:0)+(b.level?1:0);
  return bc-ac || playerName(a).length-playerName(b).length;
 })[0];
}
function pamTokenRankingRowsV8219(){

 (state.players||[]).forEach(function(p){

  if(!key)return;
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(p);
 });

 const rows=[];
 groups.forEach(function(group){
  const p=pamTokenRepresentativeV8234(group);
  const balance=pamLatestTokenBalanceV8234(p);
  // Fill missing gender from any duplicate record.
  if(!p.gender){
   const withGender=group.find(function(x){return String(x.gender||"").trim()});
   if(withGender)p.gender=withGender.gender;
  }
  rows.push({player:p,balance:balance,duplicateCount:group.length});
 });

 return rows.filter(function(x){

  if(pamTokenRankingGenderV8219==="all")return true;

 }).sort(function(a,b){

 });

function pamMinutes(time){
 const parts=String(time||"00:00").split(":").map(Number);return (parts[0]||0)*60+(parts[1]||0);
}
function pamEstimateDraft(d,participantCount){
 const n=Math.max(0,Number(participantCount||d.maxParticipants||0));
 const courts=Math.max(1,Number(d.courts)||1),slot=Math.max(1,Number(d.slotDuration||20));
 if(d.competitionType==="national_event")return {matches:0,minutes:0,predicted:new Date((d.date||new Date().toISOString().slice(0,10))+"T"+(d.startTime||"20:00")+":00"),available:0,delta:9999};
 let matches=0;
 if(d.competitionType==="fixed_pairs"){
  const pairs=Math.floor(n/2), per=Math.max(3,Number(d.pairsPerGroup)||4), groups=Math.max(1,Math.ceil(pairs/per));
  const base=Math.ceil(pairs/groups); matches=groups*(base*(base-1)/2);
 }else matches=n>3?(n in {6:1,8:1,10:1,12:1,16:1}?n:Math.max(4,n)):0;
 if(d.returnLeg)matches*=2;
 const rounds=Math.ceil(matches/courts);
 const finals=(d.competitionType==="fixed_pairs"?3:4)*slot;
 const minutes=rounds*slot+finals;
 const start=new Date((d.date||new Date().toISOString().slice(0,10))+"T"+(d.startTime||"20:00")+":00");
 const predicted=new Date(start.getTime()+minutes*60000);
 const end=new Date((d.endDate||d.date)+"T"+(d.endTime||"23:00")+":00");
 return {matches,minutes,predicted,available:Math.round((end-start)/60000),delta:Math.round((end-predicted)/60000)};
}

 const cls=r.delta>=20?"success":r.delta>=0?"":"error";

function pamOptimizeRoundGroups(matches,courts){
 courts=Math.max(1,Number(courts)||1);
 const list=(matches||[]).slice();
 const people=function(m){return (m.t1||[]).concat(m.t2||[])};
 const compatible=function(a,b){
  const used=new Set(people(a));
  return people(b).every(function(id){return !used.has(id)});
 };

 if(courts===1)return {groups:list.map(function(m){return[m]}),wastedSlots:0};

 if(courts===2&&list.length<=22){
  const n=list.length;
  const memo=new Map();
  function solve(mask){
   if(mask===0)return {singletons:0,groups:[]};
   if(memo.has(mask))return memo.get(mask);
   let first=0;while(first<n&&!(mask&(1<<first)))first++;
   let best=solve(mask&~(1<<first));
   best={singletons:best.singletons+1,groups:[[first]].concat(best.groups)};
   for(let j=first+1;j<n;j++){
    if(!(mask&(1<<j))||!compatible(list[first],list[j]))continue;
    const sub=solve(mask&~(1<<first)&~(1<<j));
    if(sub.singletons<best.singletons){
     best={singletons:sub.singletons,groups:[[first,j]].concat(sub.groups)};
     if(best.singletons===0)break;
    }
   }
   memo.set(mask,best);return best;
  }
  const result=solve((1<<n)-1);
  const groups=result.groups.map(function(g){return g.map(function(i){return list[i]})});
  return {groups:groups,wastedSlots:result.singletons};
 }

 const remaining=list.slice(),groups=[];
 while(remaining.length){
  let bestGroup=[];
  function grow(start,chosen){
   if(chosen.length>bestGroup.length)bestGroup=chosen.slice();
   if(chosen.length>=courts)return;
   for(let i=start;i<remaining.length;i++){
    if(chosen.every(function(m){return compatible(m,remaining[i])}))grow(i+1,chosen.concat([remaining[i]]));
   }
  }
  grow(0,[]);
  if(!bestGroup.length)bestGroup=[remaining[0]];
  groups.push(bestGroup);
  bestGroup.forEach(function(m){const i=remaining.indexOf(m);if(i>=0)remaining.splice(i,1)});
 }
 const wasted=groups.reduce(function(sum,g){return sum+(courts-g.length)},0);
 return {groups:groups,wastedSlots:wasted};
}

function buildMatches(ids,courts,returnLeg,category){
 const playerIds=(ids||[]).slice();
 if(playerIds.length<4)throw new Error("servono almeno 4 giocatori per generare le partite");
 courts=Math.max(1,Number(courts)||1);

 const mixedTournament=String(category||"").trim().toLowerCase()==="misto";
 function mixedGender(id){
  const p=playerById(id),g=String((p&&p.gender)||"").trim().toLowerCase();
  if(g.startsWith("m")||g==="uomo")return "M";
  if(g.startsWith("f")||g==="donna")return "F";
  return "";
 }
 function sameSexTeam(team){
  const a=mixedGender(team[0]),b=mixedGender(team[1]);
  return !!a&&a===b;
 }
 const knownGenders=mixedTournament?playerIds.map(mixedGender):[];
 const maleCount=knownGenders.filter(function(g){return g==="M"}).length;
 const femaleCount=knownGenders.filter(function(g){return g==="F"}).length;
 const allGendersKnown=mixedTournament&&knownGenders.every(Boolean);
 const perfectlyBalancedMixed=allGendersKnown&&maleCount===femaleCount;
 if(mixedTournament&&!allGendersKnown){
  const missing=playerIds.filter(function(id){return !mixedGender(id)}).map(function(id){
   const p=playerById(id);return p?playerName(p):String(id);
  });
  throw new Error("Torneo misto: indica il sesso di tutti i partecipanti prima di generare le partite. Dato mancante: "+missing.join(", "));
 }

 function makeMatch(t1,t2){
  return{
   id:uid("m"),round:0,leg:1,court:1,
   t1:t1.slice(),t2:t2.slice(),
   score1:null,score2:null,note:""
  };
 }
 function pairKey(a,b){return[a,b].sort().join("|")}
 function teamKey(team){return team.slice().sort().join("|")}
 function matchKey(m){return[teamKey(m.t1),teamKey(m.t2)].sort().join(" VS ")}
 function shuffle(arr){
  const out=arr.slice();
  for(let i=out.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
 }

 const candidates=[];
 const seen=new Set();
 for(let a=0;a<playerIds.length-3;a++){
  for(let b=a+1;b<playerIds.length-2;b++){
   for(let c=b+1;c<playerIds.length-1;c++){
    for(let d=c+1;d<playerIds.length;d++){
     const q=[playerIds[a],playerIds[b],playerIds[c],playerIds[d]];
     [
      [[q[0],q[1]],[q[2],q[3]]],
      [[q[0],q[2]],[q[1],q[3]]],
      [[q[0],q[3]],[q[1],q[2]]]
     ].forEach(function(pairing){
      const m=makeMatch(pairing[0],pairing[1]);
      // Se uomini e donne sono in pari numero, in un torneo Misto sono
      // ammesse esclusivamente squadre uomo-donna.
      if(perfectlyBalancedMixed&&(sameSexTeam(m.t1)||sameSexTeam(m.t2)))return;
      const key=matchKey(m);
      if(!seen.has(key)){seen.add(key);candidates.push(m)}
     });
    }
   }
  }
 }

 const targetByPlayers={6:6,8:8,10:10,12:12,16:16};
 const target=Math.min(candidates.length,targetByPlayers[playerIds.length]||Math.max(4,playerIds.length));
 let selected=[];

 /* Regola fondamentale Rodeo:
    mai la stessa coppia di compagni; mai lo stesso incontro completo;
    ridurre al minimo gli stessi avversari. */
 if(playerIds.length===6&&target>=6&&!mixedTournament){
  const p=shuffle(playerIds);
  selected=[
   makeMatch([p[0],p[1]],[p[2],p[3]]),
   makeMatch([p[0],p[2]],[p[1],p[3]]),
   makeMatch([p[0],p[4]],[p[1],p[5]]),
   makeMatch([p[0],p[5]],[p[1],p[4]]),
   makeMatch([p[2],p[4]],[p[3],p[5]]),
   makeMatch([p[2],p[5]],[p[3],p[4]])
  ];
 }else{
  let best=null;
  let bestPenalty=Infinity;

  for(let attempt=0;attempt<1800;attempt++){
   const pool=shuffle(candidates);
   const chosen=[];
   const appearances={};
   const teammateUsed=new Set();
   const opponentCount={};
   const opponentTeamUsed=new Set();
   playerIds.forEach(function(id){appearances[id]=0;opponentCount[id]={}});

   while(chosen.length<target){
    let bestCandidate=null;
    let bestScore=Infinity;

    pool.forEach(function(m){
     if(m._picked)return;
     const mate1=pairKey(m.t1[0],m.t1[1]);
     const mate2=pairKey(m.t2[0],m.t2[1]);
     if(teammateUsed.has(mate1)||teammateUsed.has(mate2))return;

     const people=m.t1.concat(m.t2);
     const balance=people.reduce(function(sum,id){return sum+appearances[id]*appearances[id]},0);
     let repeatOpponents=0;
     let repeatOpponentTeams=0;

     m.t1.forEach(function(id){
      m.t2.forEach(function(opp){repeatOpponents+=(opponentCount[id][opp]||0)});
      if(opponentTeamUsed.has(id+"::"+teamKey(m.t2)))repeatOpponentTeams++;
     });
     m.t2.forEach(function(id){
      m.t1.forEach(function(opp){repeatOpponents+=(opponentCount[id][opp]||0)});
      if(opponentTeamUsed.has(id+"::"+teamKey(m.t1)))repeatOpponentTeams++;
     });

     const score=
      (mixedTournament?(Number(sameSexTeam(m.t1))+Number(sameSexTeam(m.t2)))*100000000:0)+
      balance*25+
      repeatOpponentTeams*100000+
      repeatOpponents*2500+
      Math.random();
     if(score<bestScore){bestScore=score;bestCandidate=m}
    });

    if(!bestCandidate)break;
    bestCandidate._picked=true;
    chosen.push(bestCandidate);

    teammateUsed.add(pairKey(bestCandidate.t1[0],bestCandidate.t1[1]));
    teammateUsed.add(pairKey(bestCandidate.t2[0],bestCandidate.t2[1]));
    bestCandidate.t1.concat(bestCandidate.t2).forEach(function(id){appearances[id]++});

    bestCandidate.t1.forEach(function(id){
     bestCandidate.t2.forEach(function(opp){opponentCount[id][opp]=(opponentCount[id][opp]||0)+1});
     opponentTeamUsed.add(id+"::"+teamKey(bestCandidate.t2));
    });
    bestCandidate.t2.forEach(function(id){
     bestCandidate.t1.forEach(function(opp){opponentCount[id][opp]=(opponentCount[id][opp]||0)+1});
     opponentTeamUsed.add(id+"::"+teamKey(bestCandidate.t1));
    });
   }

   pool.forEach(function(m){delete m._picked});
   if(chosen.length<target)continue;

   const values=Object.values(appearances);
   const spread=Math.max.apply(null,values)-Math.min.apply(null,values);
   let repeatedOpp=0;
   Object.values(opponentCount).forEach(function(map){
    Object.values(map).forEach(function(n){if(n>1)repeatedOpp+=n-1});
   });
   let maxOpponentRepeat=0;
   Object.values(opponentCount).forEach(function(map){
    Object.values(map).forEach(function(n){maxOpponentRepeat=Math.max(maxOpponentRepeat,n)});
   });
   const optimizedSchedule=pamOptimizeRoundGroups(chosen,courts);
   const unavoidableWaste=(courts-(target%courts))%courts;
   const extraUnusedCourtSlots=Math.max(0,optimizedSchedule.wastedSlots-unavoidableWaste);
   const sameSexTeams=mixedTournament?chosen.reduce(function(total,m){
    return total+Number(sameSexTeam(m.t1))+Number(sameSexTeam(m.t2));
   },0):0;
   const penalty=
    sameSexTeams*1000000000000+
    extraUnusedCourtSlots*1000000000+
    optimizedSchedule.groups.length*10000000+
    spread*1000000+
    maxOpponentRepeat*100000+
    repeatedOpp;

   if(penalty<bestPenalty){
    bestPenalty=penalty;
    best=chosen.map(function(m){return makeMatch(m.t1,m.t2)});
    if(spread===0&&repeatedOpp===0)break;
   }
  }

  if(best)selected=best;
 }

 if(!selected.length)throw new Error("non è stato possibile generare un calendario senza ripetere le coppie");

 const optimized=pamOptimizeRoundGroups(selected,courts);
 const ordered=[];
 optimized.groups.forEach(function(group,roundIndex){
  group.forEach(function(m,courtIndex){
   m.round=roundIndex+1;
   m.court=courtIndex+1;
   ordered.push(m);
  });
 });
 selected=ordered;
 let round=optimized.groups.length+1;

 if(returnLeg){
  const firstLeg=selected.slice();
  firstLeg.forEach(function(m){
   selected.push({
    id:uid("m"),
    round:m.round+(round-1),
    leg:2,
    court:m.court,
    t1:m.t2.slice(),
    t2:m.t1.slice(),
    score1:null,score2:null,note:""
   });
  });
 }

 return selected;
}
function pamRodeoQuality(e){
 if(!e||e.competitionType==="fixed_pairs")return null;
 const teammate={};

let timerAudioContext=null;

let pamTimerAlarmUntil=0;

function pamPrimeTimerAudio(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  timerAudioContext=timerAudioContext||new AC();
  const ctx=timerAudioContext;
  if(ctx.state==="suspended")ctx.resume().catch(function(){});
  // Sblocco audio iOS: il timer viene avviato da un tocco dell'utente.
  const osc=ctx.createOscillator(),g=ctx.createGain();
  g.gain.setValueAtTime(0.00001,ctx.currentTime);
  osc.connect(g);g.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.025);
  return true;
 }catch(err){return false}
}
function pamTimerAlarmBurst(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  timerAudioContext=timerAudioContext||new AC();
  const ctx=timerAudioContext;
  // Se è già stato sbloccato dal tasto START, su iPhone resta riproducibile a scadenza.
  if(ctx.state==="suspended")ctx.resume().catch(function(){});
  const now=ctx.currentTime;
  const tones=[
   [0.00,1180],[0.13,760],[0.26,1420],[0.42,860],
   [0.55,1320],[0.70,720],[0.84,1500]
  ];
  tones.forEach(function(spec,i){
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type=(i%2)?"sawtooth":"square";
   osc.frequency.setValueAtTime(spec[1],now+spec[0]);
   gain.gain.setValueAtTime(0.0001,now+spec[0]);
   gain.gain.exponentialRampToValueAtTime(0.72,now+spec[0]+0.012);
   gain.gain.exponentialRampToValueAtTime(0.0001,now+spec[0]+0.115);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(now+spec[0]);osc.stop(now+spec[0]+0.13);
  });
 }catch(err){}
 try{
  if(navigator.vibrate)navigator.vibrate([450,90,450,90,700,100,700]);
 }catch(err){}
}

}

  return '<div class="card pam-finals-config"><h2>FASI FINALI NAZIONALI</h2><div class="notice"><b>Regola automatica:</b> prime e seconde di ogni girone nel tabellone GOLD; terze ed eventuali quarte nel tabellone SILVER. I passaggi diretti spettano alle migliori classificate per punti, differenza game e game fatti. Il primo turno evita, quando possibile, coppie provenienti dallo stesso girone.</div><button class="primary" data-generate-fixed-finals>GENERA GOLD E SILVER</button>'+(e.fixedFinalsAdvanced?'<button class="secondary" data-reset-fixed-finals>AZZERA FASI FINALI</button>':'')+'</div>';
 }
 const programmedCount=e.nationalParentId?Math.min((e.pairs||[]).length,Math.max(2,(Number(e.nationalGroupCount)||1)*(Number(e.nationalQualifiersPerGroup)||2))):"all";
 const cfg=e.fixedFinalsAdvanced&&e.fixedFinalsAdvanced.config||{source:e.nationalParentId?"groups":"general",count:programmedCount,mode:e.finalsOption||"classic"};
 const total=(e.pairs||[]).length;
 const countOptions=Array.from(new Set([2,4,8,16,Number(programmedCount)].filter(function(n){return Number.isFinite(n)&&n>=2&&n<=total}))).sort(function(a,b){return a-b});
 return '<div class="card pam-finals-config">'+
  '<h2>CONFIGURAZIONE FASI FINALI</h2>'+
  '<div class="notice">Puoi rigenerare il tabellone in qualsiasi momento. La classifica generale ordina tutte le coppie insieme; la classifica per gironi prende prima tutte le prime, poi tutte le seconde e così via.</div>'+
  '<div class="row">'+
   '<div class="field"><label>Classifica per gli incroci</label><select id="pamFinalRankingSource">'+
    '<option value="general" '+(cfg.source==="general"?"selected":"")+'>CLASSIFICA GENERALE</option>'+
    '<option value="groups" '+(cfg.source==="groups"?"selected":"")+'>CLASSIFICA DIVISA PER GIRONI</option>'+
   '</select></div>'+
   '<div class="field"><label>Coppie qualificate</label><select id="pamFinalQualifiedCount">'+
    '<option value="all" '+(cfg.count==="all"?"selected":"")+'>TUTTE LE COPPIE</option>'+
    countOptions.map(function(n){return'<option value="'+n+'" '+(String(cfg.count)===String(n)?"selected":"")+'>'+n+' COPPIE</option>'}).join("")+
   '</select></div>'+
   '<div class="field"><label>Modalità fasi finali</label><select id="pamFinalMode">'+
    '<option value="classic" '+(cfg.mode==="classic"?"selected":"")+'>CLASSICHE</option>'+
    '<option value="gold_silver" '+(cfg.mode==="gold_silver"?"selected":"")+'>GOLD E SILVER</option>'+
    '<option value="gold_silver_bronze" '+(cfg.mode==="gold_silver_bronze"?"selected":"")+'>GOLD, SILVER E BRONZE</option>'+
   '</select></div>'+
  '</div>'+
  '<div class="pam-final-actions"><button class="primary" data-generate-fixed-finals>GENERA FASI FINALI</button>'+
  (e.fixedFinalsAdvanced?'<button class="secondary" data-reset-fixed-finals>AZZERA FASI FINALI</button>':'')+'</div>'+
 '</div>';
}
function fixedFinalsView(e){
 const table=pairStandings(e);
 const played=(e.matches||[]).filter(function(m){return m.score1!==null&&m.score2!==null}).length;
 const total=(e.matches||[]).length;
 let html=pamFixedFinalsConfigView(e);
 html+='<div class="notice '+(played===total?"success":"")+'"><b>Risultati gironi:</b> '+played+' di '+total+' partite completate.</div>';
 if(!e.fixedFinalsAdvanced)return html+'<div class="notice">Scegli le opzioni e premi <b>GENERA FASI FINALI</b>.</div>';
 pamRefreshFixedFinals(e);
 const keys=["gold","silver","bronze"];
 html+=keys.filter(function(k){return e.fixedFinalsAdvanced.brackets[k]}).map(function(k){
  return pamFixedTierView(e,k,e.fixedFinalsAdvanced.brackets[k]);
 }).join("");
 return html;
}
function pamFindFixedFinalMatch(e,id){
 if(!e.fixedFinalsAdvanced)return null;
 const brackets=e.fixedFinalsAdvanced.brackets||{};
 for(const key of Object.keys(brackets)){
  const b=brackets[key];
  if(b.matchIndex&&b.matchIndex[id])return{bracket:b,match:b.matchIndex[id],key:key};
 }
 return null;
}
function pamSaveFixedFinalResult(button){
 const e=currentEvent(),id=button.getAttribute("data-save-fixed-final");
 const found=pamFindFixedFinalMatch(e,id);if(!found)return;
 const card=button.closest("[data-fixed-final-match]");
 const msg=card.querySelector(".match-message");
 try{
  const result=pamReadSetScores(card,e,"fixed-final-"+id,false);
  found.bracket.results[id]={a:result.score1,b:result.score2};
  pamSetMatchStarted(e,"fixed-final-"+id,false,false);
  save();render();
 }catch(err){
  msg.className="notice error";msg.textContent="Errore: "+err.message;
 }
}
function pamEditFixedFinalResult(id){
 const e=currentEvent(),found=pamFindFixedFinalMatch(e,id);if(!found)return;
 delete found.bracket.results[id];
 save();render();
}

function ensureFinalStages(e){
 if(!e.finalStages){
  e.finalStages={
   elimination:{teamA:[],teamB:[],score1:null,score2:null},
   auction1:{spending:{}},
   semifinals:[
    {id:"semi1",teamA:[],teamB:[],score1:null,score2:null},
    {id:"semi2",teamA:[],teamB:[],score1:null,score2:null}
   ],
   auction2:{spending:{}},
   auction3:{spending:{}},
   auction4:{spending:{}},
   final:{teamA:[],teamB:[],score1:null,score2:null},
   elimination12:[
    {id:"elim12_1",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null},
    {id:"elim12_2",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null}
   ],
   quarterfinals:[
    {id:"qf1",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null},
    {id:"qf2",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null},
    {id:"qf3",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null},
    {id:"qf4",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null}
   ]
  };
 }
 if(!e.finalStages.auction1)e.finalStages.auction1={spending:{}};
 if(!e.finalStages.auction1.spending)e.finalStages.auction1.spending={};
 if(!e.finalStages.auction2)e.finalStages.auction2={spending:{}};
 if(!e.finalStages.auction2.spending)e.finalStages.auction2.spending={};
 if(!e.finalStages.auction3)e.finalStages.auction3={spending:{}};
 if(!e.finalStages.auction3.spending)e.finalStages.auction3.spending={};
 if(!e.finalStages.auction4)e.finalStages.auction4={spending:{}};
 if(!e.finalStages.auction4.spending)e.finalStages.auction4.spending={};
 e.auctionCount=Math.min(4,Math.max(1,Number(e.auctionCount)||2));
 if(!Array.isArray(e.finalStages.elimination12)||e.finalStages.elimination12.length!==2){
  e.finalStages.elimination12=[
   {id:"elim12_1",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null},
   {id:"elim12_2",teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null}
  ];
 }
 if(!Array.isArray(e.finalStages.quarterfinals)||e.finalStages.quarterfinals.length!==4){
  e.finalStages.quarterfinals=[1,2,3,4].map(function(i){return{id:"qf"+i,teamA:[],teamB:[],score1:null,score2:null,score1R:null,score2R:null}});
 }
 if(!Array.isArray(e.finalStages.semifinals)||e.finalStages.semifinals.length!==2){
  e.finalStages.semifinals=[
   {id:"semi1",teamA:[],teamB:[],score1:null,score2:null},
   {id:"semi2",teamA:[],teamB:[],score1:null,score2:null}
  ];
 }
 return e.finalStages;
}

function stageNeedsReturn(e,stage){
 if(stage==="elimination")return !!e.eliminationReturnLeg;
 if(stage==="semi1"||stage==="semi2")return !!e.semifinalReturnLeg;
 if(stage==="final")return !!e.finalReturnLeg;
 return false;
}
function stageLegComplete(m,leg){
 if(leg===2)return m.score1R!==null&&m.score1R!==undefined&&m.score2R!==null&&m.score2R!==undefined;
 return m.score1!==null&&m.score1!==undefined&&m.score2!==null&&m.score2!==undefined;
}
function stageAggregate(e,stage,m){
 if(!stageLegComplete(m,1))return null;
 if(stageNeedsReturn(e,stage)&&!stageLegComplete(m,2))return null;
 return {
  a:Number(m.score1||0)+(stageNeedsReturn(e,stage)?Number(m.score1R||0):0),
  b:Number(m.score2||0)+(stageNeedsReturn(e,stage)?Number(m.score2R||0):0)
 };
}
function stageWinnerTeam(e,stage,m){
 const t=stageAggregate(e,stage,m);
 if(!t||t.a===t.b)return [];
 return t.a>t.b?m.teamA.slice():m.teamB.slice();
}
function stageLegCard(e,stage,m,label,leg,index,court,phase){
 const ret=leg===2;
 const a=ret?m.score1R:m.score1,b=ret?m.score2R:m.score2;
 const saved=a!==null&&a!==undefined&&b!==null&&b!==undefined;
 const operationKey="stage-"+stage+"-"+leg;
 return '<div class="match'+pamMatchStartedClass(e,operationKey)+'" data-stage-card="'+stage+'" data-stage-leg="'+leg+'">'+
 '<span class="pill">'+label+' · '+(ret?"Ritorno":"Andata")+'</span>'+
 matchMetaHtml(e,index,label+(ret?" - Ritorno":" - Andata"),court)+timerHtml(e,"stage-"+stage+"-"+leg,phase)+
 matchupStackHtml(teamStackHtml(m.teamA),teamStackHtml(m.teamB))+pamMatchOperationsHtml(e,operationKey)+
 (saved?'<div class="notice success">Risultato: <b>'+a+' - '+b+'</b></div>'+pamSavedSetScoresHtml(e,operationKey)+'<button class="secondary" data-action="edit-stage-result" data-stage="'+stage+'" data-leg="'+leg+'">Modifica risultato</button>':
 pamSetScoreInputsHtml(e,operationKey)+'<div class="match-message"></div><button class="primary" data-action="save-stage-result" data-stage="'+stage+'" data-leg="'+leg+'">Salva risultato</button>')+
 '</div>';
}
function stagePlayerOptions(ids,selected){
 return '<option value="">-- seleziona --</option>'+ids.map(function(id){
  return '<option value="'+id+'" '+(id===selected?"selected":"")+'>'+esc(playerName(playerById(id)))+'</option>';
 }).join("");
}
function initEliminationFromRanking(e){
 const fs=ensureFinalStages(e);
 const rank=standings(e);
 if(rank.length!==10)return false;
 const m=fs.elimination;
 const wantedA=[rank[6].id,rank[9].id]; // 7° + 10°
 const wantedB=[rank[7].id,rank[8].id]; // 8° + 9°
 const hasResult=[m.score1,m.score2,m.score1R,m.score2R].some(function(v){
  return v!==null&&v!==undefined;
 });
 if(!hasResult&&(m.teamA.join("|")!==wantedA.join("|")||m.teamB.join("|")!==wantedB.join("|"))){
  m.teamA=wantedA.slice();m.teamB=wantedB.slice();
  m.score1=null;m.score2=null;m.score1R=null;m.score2R=null;
  save();
 }
 return true;
}

function initElimination12(e){
 const fs=ensureFinalStages(e),fullRank=standings(e);
 if(fullRank.length!==12&&fullRank.length!==14)return false;
 const rank=fullRank.slice(0,12);
 const wanted=[
  {teamA:[rank[4].id,rank[11].id],teamB:[rank[7].id,rank[8].id]},
  {teamA:[rank[5].id,rank[10].id],teamB:[rank[6].id,rank[9].id]}
 ];
 fs.elimination12.forEach(function(m,i){
  if(m.teamA.join("|")!==wanted[i].teamA.join("|")||m.teamB.join("|")!==wanted[i].teamB.join("|")){
   m.teamA=wanted[i].teamA.slice();m.teamB=wanted[i].teamB.slice();
   m.score1=null;m.score2=null;m.score1R=null;m.score2R=null;
  }
 });
 save();return true;
}
function elimination12Winners(e){
 const fs=ensureFinalStages(e),out=[];
 fs.elimination12.forEach(function(m,i){
  const w=stageWinnerTeam(e,"elim12_"+(i+1),m);
  if(w.length===2)out.push.apply(out,w);
 });
 return out;
}
function initQuarterfinals16(e){
 const fs=ensureFinalStages(e),rank=standings(e);
 if(rank.length!==16)return false;
 const pairs=[
  [rank[0].id,rank[15].id],[rank[7].id,rank[8].id],
  [rank[3].id,rank[12].id],[rank[4].id,rank[11].id],
  [rank[1].id,rank[14].id],[rank[6].id,rank[9].id],
  [rank[2].id,rank[13].id],[rank[5].id,rank[10].id]
 ];
 const wanted=[
  {teamA:pairs[0],teamB:pairs[1]},
  {teamA:pairs[2],teamB:pairs[3]},
  {teamA:pairs[4],teamB:pairs[5]},
  {teamA:pairs[6],teamB:pairs[7]}
 ];
 fs.quarterfinals.forEach(function(m,i){
  if(m.teamA.join("|")!==wanted[i].teamA.join("|")||m.teamB.join("|")!==wanted[i].teamB.join("|")){
   m.teamA=wanted[i].teamA.slice();m.teamB=wanted[i].teamB.slice();
   m.score1=null;m.score2=null;m.score1R=null;m.score2R=null;
  }
 });
 save();return true;
}
function quarterfinalWinners(e){
 const fs=ensureFinalStages(e),out=[];
 fs.quarterfinals.forEach(function(m,i){
  const w=stageWinnerTeam(e,"qf"+(i+1),m);
  if(w.length===2)out.push.apply(out,w);
 });
 return out;
}

function eliminationWinners(e){
 return stageWinnerTeam(e,"elimination",ensureFinalStages(e).elimination);
}
function eliminationView(e){
 const fs=ensureFinalStages(e),rank=standings(e),n=rank.length,base=(e.matches||[]).length;
 if(n===6){
  return sixKnockoutView(e,e.competitionType==="rodeo_simple"?"simple":"tokens");
 }
 if(n===8){
  return '<div class="notice success"><b>8 giocatori:</b> nessuna eliminatoria. Tutti accedono direttamente alle fasi finali.</div>';
 }
 if(n===10){
  initEliminationFromRanking(e);
  const m=fs.elimination;
  const cards=stageLegCard(e,"elimination",m,"Eliminatoria",1,base,1,"elimination")+
   (e.eliminationReturnLeg?stageLegCard(e,"elimination",m,"Eliminatoria",2,base+1,1,"elimination"):"");
  const t=stageAggregate(e,"elimination",m),w=stageWinnerTeam(e,"elimination",m);
  const summary=t?(t.a===t.b?'<div class="notice error">Totale in parità: <b>'+t.a+' - '+t.b+'</b>.</div>':'<div class="notice success">Qualificati: <b>'+esc(names(w))+'</b></div>'):"";
  return '<div class="notice"><b>10 giocatori:</b> 7°+10° contro 8°+9°. I vincitori raggiungono i primi 6.</div>'+cards+summary;
 }
 if(n===12||n===14){
  initElimination12(e);
  const cards=fs.elimination12.map(function(m,i){
   const stage="elim12_"+(i+1),idx=base+i*(e.eliminationReturnLeg?2:1);
   const c=stageLegCard(e,stage,m,"Eliminatoria "+(i+1),1,idx,i+1,"elimination")+
    (e.eliminationReturnLeg?stageLegCard(e,stage,m,"Eliminatoria "+(i+1),2,idx+1,i+1,"elimination"):"");
   const t=stageAggregate(e,stage,m),w=stageWinnerTeam(e,stage,m);
   return c+(t?(t.a===t.b?'<div class="notice error">Totale in parità.</div>':'<div class="notice success">Qualificati: <b>'+esc(names(w))+'</b></div>'):"");
  }).join("");
  const excluded=n===14?rank.slice(12,14):[];
  const intro=n===14
   ?'<div class="notice"><b>14 giocatori:</b> il 13° e il 14° vengono esclusi dalla fase eliminatoria. Accedono i primi 12: i primi 4 passano direttamente, mentre dal 5° al 12° disputano due eliminatorie per completare gli 8 finalisti.<br><b>Esclusi:</b> '+esc(excluded.map(function(x){return playerName(playerById(x.id))}).join(" · "))+'</div>'
   :'<div class="notice"><b>12 giocatori:</b> i primi 4 passano direttamente. Dal 5° al 12° disputano due eliminatorie per completare gli 8 finalisti.</div>';
  return intro+cards;
 }
 if(n===16){
  initQuarterfinals16(e);
  const cards=fs.quarterfinals.map(function(m,i){
   const stage="qf"+(i+1),idx=base+i*(e.eliminationReturnLeg?2:1);
   const c=stageLegCard(e,stage,m,"Quarto di finale "+(i+1),1,idx,(i%Math.max(1,e.courts))+1,"elimination")+
    (e.eliminationReturnLeg?stageLegCard(e,stage,m,"Quarto di finale "+(i+1),2,idx+1,(i%Math.max(1,e.courts))+1,"elimination"):"");
   const t=stageAggregate(e,stage,m),w=stageWinnerTeam(e,stage,m);
   return c+(t?(t.a===t.b?'<div class="notice error">Totale in parità.</div>':'<div class="notice success">Qualificati: <b>'+esc(names(w))+'</b></div>'):"");
  }).join("");
  return '<div class="notice success"><b>16 giocatori:</b> nessuna fase eliminatoria preliminare. Si parte direttamente dai quarti di finale.</div>'+cards;
 }
 return '<div class="notice error">Formati automatici disponibili con 6, 8, 10, 12, 14 oppure 16 giocatori.</div>';
}
function semifinalQualified(e){
 const rank=standings(e),n=rank.length;
 if(n===8)return rank.map(function(x){return x.id});
 if(n===10)return rank.slice(0,6).map(function(x){return x.id}).concat(eliminationWinners(e));
 if(n===12)return rank.slice(0,4).map(function(x){return x.id}).concat(elimination12Winners(e));
 if(n===14)return rank.slice(0,4).map(function(x){return x.id}).concat(elimination12Winners(e));
 if(n===16)return quarterfinalWinners(e);
 return [];
}
function auctionBalanceBefore(e,id){
 const row=standings(e).find(function(x){return x.id===id});
 return row?row.balance:0;
}
function auction1View(e){

   const spent=Number(fs.auction1.spending[id])||0;
   return '<tr><td><b>'+esc(playerName(playerById(id)))+'</b></td><td>'+available+'</td><td><input type="number" min="0" max="'+available+'" value="'+spent+'" data-auction1-spend="'+id+'"></td><td><b>'+(available-spent)+'</b></td></tr>';
  }).join("");

   '<div class="card table-wrap"><table class="table"><thead><tr><th>Giocatore</th><th>Disponibili</th><th>Spesi</th><th>Residui</th></tr></thead><tbody>'+spendRows+'</tbody></table></div>'+
   '<button class="primary" data-action="save-auction1">Salva asta</button><div style="height:12px"></div>'+sixKnockoutView(e,"tokens");
 }
 const fs=ensureFinalStages(e),qualified=semifinalQualified(e);
 if(qualified.length!==8){

  return '<div class="notice error">'+msg+'</div>';
 }
 const spendRows=qualified.map(function(id){
  const available=auctionBalanceBefore(e,id)+(Number(fs.auction1.spending[id])||0),spent=Number(fs.auction1.spending[id])||0;
  return '<tr><td><b>'+esc(playerName(playerById(id)))+'</b></td><td>'+available+'</td><td><input type="number" min="0" max="'+available+'" value="'+spent+'" data-auction1-spend="'+id+'"></td><td><b>'+(available-spent)+'</b></td></tr>';
 }).join("");
 const semis=fs.semifinals.map(function(m,index){
  const stage="semi"+(index+1),base=(e.matches||[]).length+1+index*(e.semifinalReturnLeg?2:1);
  const selectors='<div class="row"><div class="field"><label>Coppia A - giocatore 1</label><select data-team-stage="'+stage+'" data-side="A" data-pos="0">'+stagePlayerOptions(qualified,m.teamA[0])+'</select></div><div class="field"><label>Coppia A - giocatore 2</label><select data-team-stage="'+stage+'" data-side="A" data-pos="1">'+stagePlayerOptions(qualified,m.teamA[1])+'</select></div></div>'+
  '<div class="row"><div class="field"><label>Coppia B - giocatore 1</label><select data-team-stage="'+stage+'" data-side="B" data-pos="0">'+stagePlayerOptions(qualified,m.teamB[0])+'</select></div><div class="field"><label>Coppia B - giocatore 2</label><select data-team-stage="'+stage+'" data-side="B" data-pos="1">'+stagePlayerOptions(qualified,m.teamB[1])+'</select></div></div>';
  const cards=stageLegCard(e,stage,m,"Semifinale "+(index+1),1,base,index+1,"semifinal")+
   (e.semifinalReturnLeg?stageLegCard(e,stage,m,"Semifinale "+(index+1),2,base+1,index+1,"semifinal"):"");
  const t=stageAggregate(e,stage,m),w=stageWinnerTeam(e,stage,m);
  const summary=t?(t.a===t.b?'<div class="notice error">Totale in parità: <b>'+t.a+' - '+t.b+'</b>.</div>':'<div class="notice success">Totale semifinale: <b>'+t.a+' - '+t.b+'</b><br>Finalisti: <b>'+esc(names(w))+'</b></div>'):"";
  return '<div class="card"><h2>Composizione semifinale '+(index+1)+'</h2>'+selectors+'</div>'+cards+summary;
 }).join("");
 return '<div class="notice"><b>Prima asta:</b> inserisci i gettoni spesi e componi le semifinali.</div>'+
 '<div class="card table-wrap"><table class="table"><thead><tr><th>Giocatore</th><th>Disponibili</th><th>Spesi</th><th>Residui</th></tr></thead><tbody>'+spendRows+'</tbody></table></div>'+
 '<button class="primary" data-action="save-auction1">Salva prima asta</button><div style="height:12px"></div>'+semis;
}
function semifinalWinners(e){
 const fs=ensureFinalStages(e),out=[];
 fs.semifinals.forEach(function(m,i){
  const w=stageWinnerTeam(e,"semi"+(i+1),m);
  if(w.length===2)out.push.apply(out,w);
 });
 return out;
}

function pamAuctionCount(e){return Math.min(4,Math.max(1,Number(e.auctionCount)||2))}
function pamAuctionData(e,which){
 const fs=ensureFinalStages(e),key="auction"+which;
 if(!fs[key])fs[key]={spending:{}};
 if(!fs[key].spending)fs[key].spending={};
 return fs[key];
}
function pamAuctionRows(e,which,ids,label){

async function pamSaveGuidedAuctionV8211(which,btn){
 const e=currentEvent();if(!e)return false;
 try{
  const ids=pamGuidedAuctionCandidatesV8211(e,which).map(String);
  const rows=pamGuidedAuctionReadV8211(which);
  const expected=pamGuidedAuctionRowsCountV8211(e,which);
  if(rows.length!==expected)throw new Error("numero di acquisti non corretto");
  if(rows.some(function(r){return !r.buyer||!r.player}))throw new Error("seleziona compratore e giocatore acquistato in ogni riga");
  if(rows.some(function(r){return r.buyer===r.player}))throw new Error("un giocatore non può acquistare se stesso");

  const used=[];
  rows.forEach(function(r){used.push(r.buyer,r.player)});
  if(new Set(used).size!==ids.length||used.length!==ids.length)throw new Error("ogni giocatore della fase deve comparire una sola volta");
  if(used.some(function(id){return !ids.includes(String(id))}))throw new Error("è stato selezionato un giocatore non ammesso in questa fase");

  rows.forEach(function(r){
   const available=pamGuidedAuctionAvailableV8211(e,which,r.buyer);
   if(r.price>available)throw new Error(playerName(playerById(r.buyer))+" ha "+available+" gettoni disponibili, non "+r.price);
  });

  if(!confirm("Confermi l'asta? Verranno aggiornati i gettoni e generate automaticamente le partite della fase "+pamGuidedAuctionPhaseV8211(e,which)+"."))return false;

  btn.disabled=true;btn.textContent="GENERAZIONE IN CORSO...";
  pamGuidedAuctionStatusV8211("Salvataggio asta e generazione partite...","");

  const auction=pamAuctionData(e,which);
  auction.guidedPairs=rows.map(function(r){return {buyer:r.buyer,player:r.player,price:r.price}});
  auction.spending={};
  ids.forEach(function(id){auction.spending[id]=0});
  rows.forEach(function(r){auction.spending[r.buyer]=(Number(auction.spending[r.buyer])||0)+r.price});

  const count=pamAuctionCount(e);
  e.playerIds.forEach(function(id){
   e.ledger[id]=e.ledger[id]||{carried:0,spent:0,podium:0};
   let total=0;
   for(let i=1;i<=count;i++)total+=Number(pamAuctionData(e,i).spending[id])||0;
   e.ledger[id].spent=total;
  });

  const fs=ensureFinalStages(e);
  const pairs=rows.map(function(r){return [r.buyer,r.player]});

  if(which===1&&pairs.length===4){
   fs.semifinals[0].teamA=pairs[0].slice();
   fs.semifinals[0].teamB=pairs[1].slice();
   fs.semifinals[0].score1=null;fs.semifinals[0].score2=null;fs.semifinals[0].score1R=null;fs.semifinals[0].score2R=null;
   fs.semifinals[1].teamA=pairs[2].slice();
   fs.semifinals[1].teamB=pairs[3].slice();
   fs.semifinals[1].score1=null;fs.semifinals[1].score2=null;fs.semifinals[1].score1R=null;fs.semifinals[1].score2R=null;
  }else if(which>1&&pairs.length===2){
   fs.final.teamA=pairs[0].slice();
   fs.final.teamB=pairs[1].slice();
   fs.final.score1=null;fs.final.score2=null;fs.final.score1R=null;fs.final.score2R=null;
  }else{
   throw new Error("configurazione della fase non compatibile con l'asta guidata");
  }

  pamProtectCurrentEdit(8000);
  pamPersistStateLocalV82381();

  if(pamCloudReady&&PAM_SESSION){
   try{await pamCloudSyncAll()}
   catch(err){console.warn("Sync asta guidata:",err);pamToast("Asta creata sul dispositivo; sincronizzazione cloud da completare.","error")}
  }

  pamGuidedAuctionStatusV8211("Asta confermata. Gettoni aggiornati e "+pamGuidedAuctionPhaseV8211(e,which).toLowerCase()+" generate.","success");
  pamToast("Asta "+which+" completata: "+pamGuidedAuctionPhaseV8211(e,which)+" generate automaticamente.","success");

  setTimeout(function(){
   const y=window.scrollY;render();requestAnimationFrame(function(){window.scrollTo(0,y)});
  },450);
 }catch(err){
  console.error("Asta guidata:",err);
  pamGuidedAuctionStatusV8211("ERRORE: "+(err.message||err),"error");
  if(btn){btn.disabled=false;btn.textContent="CONFERMA ASTA E GENERA "+pamGuidedAuctionPhaseV8211(e,which).toUpperCase()}
 }
 return false;
}

function stageMatch(e,stage){
 if(e.playerIds&&e.playerIds.length===6&&(stage==="elimination"||stage==="final")){
  const type=e.competitionType==="rodeo_simple"?"simple":"tokens";
  const k=ensureSixKnockout(e,type);
  return stage==="elimination"?k.elimination:k.final;
 }
 const fs=ensureFinalStages(e);
 if(stage==="elimination")return fs.elimination;
 if(stage.indexOf("elim12_")===0)return fs.elimination12[Number(stage.split("_")[1])-1];
 if(stage.indexOf("qf")===0)return fs.quarterfinals[Number(stage.replace("qf",""))-1];
 if(stage==="semi1")return fs.semifinals[0];
 if(stage==="semi2")return fs.semifinals[1];
 if(stage==="final")return fs.final;
 return null;
}
function validateStageTeams(m){
 if(!m||m.teamA.length!==2||m.teamB.length!==2)return false;
 const all=m.teamA.concat(m.teamB);
 return all.every(Boolean)&&new Set(all).size===4;
}
function saveStageResult(button){

 try{
  if(stage!=="elimination"&&!validateStageTeams(m))throw new Error("seleziona quattro giocatori diversi");
  const result=pamReadSetScores(card,e,"stage-"+stage+"-"+leg,false);
  if(leg===2){m.score1R=result.score1;m.score2R=result.score2}else{m.score1=result.score1;m.score2=result.score2}
  pamSetMatchStarted(e,"stage-"+stage+"-"+leg,false,false);
  if(stage==="final"&&e.competitionType==="rodeo_tokens"){
   e.playerIds.forEach(function(id){e.ledger[id].podium=0});
   const t=stageAggregate(e,"final",m);
   if(t&&t.a!==t.b){
    const w=t.a>t.b?m.teamA:m.teamB,s=t.a>t.b?m.teamB:m.teamA;
    w.forEach(function(id){e.ledger[id].podium=10});s.forEach(function(id){e.ledger[id].podium=5});
   }
  }

 }catch(err){if(msg){msg.className="notice error";msg.textContent="Errore: "+err.message}}
}

const PAM_ADMIN_ROSTER_CACHE={};
function pamRosterStatusLabel(v){return v==='approved'?'APPROVATO':v==='rejected'?'RIFIUTATO':'IN ATTESA'}
function pamRosterStatusClass(v){return v==='approved'?'pam-status-approved':v==='rejected'?'pam-status-rejected':'pam-status-pending'}
async function pamLoadAdminRoster(teamId){
 const area=document.getElementById('pamAdminRosterArea');if(!area)return;
 if(!PAM_SESSION){area.innerHTML='<div class="notice error">Accedi come amministratore per vedere e gestire le richieste online.</div>';return}
 area.innerHTML='<div class="muted">Caricamento richieste in corso...</div>';
 const {data,error}=await sb.from('championship_roster_players').select('*').eq('team_id',teamId).order('created_at',{ascending:false});
 if(error){area.innerHTML='<div class="notice error">Impossibile caricare la rosa: '+esc(error.message)+'</div>';return}
 PAM_ADMIN_ROSTER_CACHE[teamId]=data||[];pamRenderAdminRoster(teamId);
}
function pamRenderAdminRoster(teamId){
 const area=document.getElementById('pamAdminRosterArea');if(!area)return;
 const rows=PAM_ADMIN_ROSTER_CACHE[teamId]||[];
 const active=rows.filter(r=>r.approval_status!=='rejected'),pending=rows.filter(r=>r.approval_status==='pending'),approved=rows.filter(r=>r.approval_status==='approved');
 const badge=document.getElementById('pamRosterPendingBadge');if(badge)badge.innerHTML=pending.length?'<span class="pam-notification-badge">'+pending.length+'</span>':'';
 let html='<div class="pam-roster-placeholder"><div><b>'+active.length+' / 20</b><small>Giocatori inseriti</small></div><div><b>'+pending.length+'</b><small>In attesa di approvazione</small></div><div><b>'+approved.length+'</b><small>Schierabili</small></div></div>';
 if(!rows.length){area.innerHTML=html+'<div class="notice">Non è ancora arrivata alcuna richiesta.</div>';return}
 html+='<div class="pam-roster-list">'+rows.map(function(r){return '<div class="pam-roster-row"><img src="'+esc(r.photo_url||'assets/padel-arena-manager-logo.png')+'"><div><b>'+esc((r.first_name||'')+' '+(r.last_name||''))+'</b><small>'+esc(r.email||'')+' · '+esc(r.phone||'')+'</small><small class="'+pamRosterStatusClass(r.approval_status)+'"><b>'+pamRosterStatusLabel(r.approval_status)+'</b>'+(r.rejection_reason?' · '+esc(r.rejection_reason):'')+'</small></div><div class="pam-roster-actions">'+(r.approval_status==='pending'?'<button class="primary small" data-admin-roster-approve="'+r.id+'" data-team-id="'+teamId+'">Approva</button><button class="danger small" data-admin-roster-reject="'+r.id+'" data-team-id="'+teamId+'">Rifiuta</button>':'')+'</div></div>'}).join('')+'</div>';
 area.innerHTML=html;
}
async function pamDecideRoster(playerId,teamId,decision){
 let reason=null;if(decision==='rejected'){reason=prompt('Motivo del rifiuto (sarà visibile nella gestione):','Dati da correggere');if(reason===null)return}
 const {error}=await sb.rpc('decide_championship_roster_player',{p_player_id:playerId,p_decision:decision,p_reason:reason});
 if(error){pamToast('Errore: '+error.message,'error');return}
 pamToast(decision==='approved'?'Giocatore approvato e inserito nella rosa.':'Richiesta rifiutata. Il giocatore potrà compilarla nuovamente.','success');
 await pamLoadAdminRoster(teamId);
}
document.addEventListener('click',function(e){
 const ap=e.target.closest('[data-admin-roster-approve]'),rj=e.target.closest('[data-admin-roster-reject]');if(!ap&&!rj)return;
 const el=ap||rj;pamDecideRoster(el.getAttribute(ap?'data-admin-roster-approve':'data-admin-roster-reject'),el.getAttribute('data-team-id'),ap?'approved':'rejected');
});
</script>
<script id="pam-v8217-brand-handlers">
document.addEventListener("change",function(ev){
 const input=ev.target&&ev.target.closest?ev.target.closest("[data-brand-logo-v8214]"):null;
 if(input){pamHandleBrandLogoV8214(input);return}
});
document.addEventListener("click",function(ev){
 const clear=ev.target&&ev.target.closest?ev.target.closest("[data-clear-brand-logo-v8214]"):null;
 if(clear){
  ev.preventDefault();
  const key=clear.getAttribute("data-clear-brand-logo-v8214");
  if(key){state.draft[key]="";render()}
  return;
 }
},true);
</script>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Area giocatore · Padel Arena</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#06101d;--card:#10233b;--line:#315174;--text:#f8fafc;--muted:#adc0d3;--lime:#9dff25;--red:#ff5364}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#164967,transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:14px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;border-radius:18px}.card{background:#10233bf2;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.notice{border:1px solid var(--line);border-radius:14px;padding:13px;background:#08192b;margin:10px 0}.success{border-color:#4ade80;background:#0b2b21}.error{border-color:var(--red);background:#35131a}.muted{color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:900;margin:9px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border:1px solid #406489;border-radius:12px;background:#071523;color:#fff}button,.button{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--lime);color:#07111f;text-align:center;text-decoration:none;font-weight:950;margin-top:9px}.secondary{background:#183856;color:#fff;border:1px solid #41678c}.event{border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;background:#091a2c}.hidden{display:none!important}@media(max-width:640px){.row{grid-template-columns:1fr}.top{align-items:flex-start}.top button{width:auto}}</style></head><body><main><div class="top"><div class="brand"><img src="assets/padel-arena-manager-logo.png"><div><h1 style="margin:0">Area giocatore</h1><div class="muted">Padel Arena Manager</div></div></div><button class="secondary" style="width:auto" onclick="logout()">ESCI</button></div><div id="app"><div class="card">Caricamento…</div></div></main><script>
const sb=supabase.createClient('https://zxubwvtngyfebtfnvnwg.supabase.co','sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO',{auth:{persistSession:true}}),esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let account=null;
function itError(e){const m=String(e?.message||e||'Errore sconosciuto');if(/invalid login credentials/i.test(m))return 'Email o password non corrette.';if(/email not confirmed/i.test(m))return 'Devi prima confermare il tuo indirizzo email.';if(/rate limit|too many requests/i.test(m))return 'Hai effettuato troppi tentativi. Attendi qualche minuto e riprova.';return m}
async function load(){const s=await sb.auth.getSession();if(!s.data.session)return login();const r=await sb.rpc('player_my_account');if(r.error||!r.data)return document.getElementById('app').innerHTML='<div class="card error">'+esc(r.error?.message||'Account giocatore non collegato. Apri nuovamente il link di invito.')+'</div>';account=r.data;render();loadEvents()}
function login(){document.getElementById('app').innerHTML='<form class="card" id="login"><h2>Accedi come giocatore</h2><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button>ACCEDI</button><button class="secondary" type="button" onclick="forgotPassword()">PASSWORD DIMENTICATA?</button><div id="msg"></div></form>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:e.target.email.value.trim().toLowerCase(),password:e.target.password.value});if(r.error)return document.getElementById('msg').innerHTML='<div class="notice error">'+esc(itError(r.error))+'</div>';load()}}
async function forgotPassword(){const email=document.querySelector('#login [name=email]')?.value.trim().toLowerCase()||prompt('Inserisci l’indirizzo email del tuo account giocatore:','');if(!email)return;const redirect=new URL('reset-password.html',location.href).href;const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});const msg=document.getElementById('msg');if(r.error){msg.innerHTML='<div class="notice error">'+esc(itError(r.error))+'</div>';return}msg.innerHTML='<div class="notice success"><b>Email inviata.</b><br>Controlla anche la cartella spam e apri il collegamento per scegliere una nuova password.</div>'}
function render(){const p=account.profile||{},restricted=account.scope==='event';document.getElementById('app').innerHTML='<div class="notice success"><b>'+(restricted?'ACCESSO LIMITATO AL SINGOLO EVENTO':'ACCESSO GIOCATORE ALLA PIATTAFORMA')+'</b><br>'+(restricted?'Puoi seguire esclusivamente l’evento indicato nel tuo invito.':'Puoi esplorare tutti gli eventi pubblicati.')+' Non puoi modificare tornei, risultati o dati degli altri giocatori.</div><section class="card"><h2>La mia anagrafica</h2><form id="profile"><div class="row"><div><label>Nome</label><input name="firstName" value="'+esc(p.firstName||'')+'" required></div><div><label>Cognome</label><input name="lastName" value="'+esc(p.lastName||'')+'" required></div></div><div class="row"><div><label>Data di nascita</label><input type="date" name="birth" value="'+esc(p.birth||p.birthDate||'')+'"></div><div><label>Telefono</label><input name="phone" value="'+esc(p.phone||'')+'"></div></div><div class="row"><div><label>Comune</label><input name="residenceTown" value="'+esc(p.residenceTown||'')+'"></div><div><label>Provincia</label><input name="residenceProvince" maxlength="2" value="'+esc(p.residenceProvince||'')+'"></div></div><button>SALVA LA MIA ANAGRAFICA</button><div id="profileMsg"></div></form></section><section class="card"><h2>'+(restricted?'Il mio evento':'Eventi e tornei')+'</h2><div id="events">Caricamento…</div></section>';
document.getElementById('profile').onsubmit=saveProfile}
async function saveProfile(e){e.preventDefault();const d=new FormData(e.target),payload={firstName:d.get('firstName'),lastName:d.get('lastName'),birth:d.get('birth'),phone:d.get('phone'),residenceTown:d.get('residenceTown'),residenceProvince:String(d.get('residenceProvince')||'').toUpperCase()};const r=await sb.rpc('player_update_my_profile',{p_payload:payload});document.getElementById('profileMsg').innerHTML='<div class="notice '+(r.error?'error':'success')+'">'+esc(r.error?.message||'Anagrafica aggiornata.')+'</div>'}
async function loadEvents(){const r=await sb.rpc('player_visible_tournaments');const box=document.getElementById('events');if(!box)return;if(r.error)return box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';box.innerHTML=(r.data||[]).map(e=>'<div class="event"><b>'+esc(e.name)+'</b><div class="muted">'+esc(e.event_date||'Data da definire')+' · '+esc(e.club||'')+' · '+esc(e.category||'')+'</div>'+(e.share_token?'<a class="button secondary" href="poster.html?tournament='+encodeURIComponent(e.share_token)+'" target="_blank" rel="noopener">VEDI INFORMAZIONI PUBBLICHE</a>':'')+'</div>').join('')||'<div class="muted">Nessun evento disponibile.</div>';box.insertAdjacentHTML('beforeend','<a class="button secondary" href="index.html?public=1#tornei">ESPLORA LA PIATTAFORMA COME ACCOUNT FREE</a>')}
async function logout(){await sb.auth.signOut();location.reload()}load();
</script></body></html>

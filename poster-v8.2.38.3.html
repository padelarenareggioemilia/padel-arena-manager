<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<title>Locandina torneo · Padel Arena Manager</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
 --navy:#061426;--navy2:#0b2744;--blue:#168ed0;--lime:#a8ff32;
 --text:#f8fbff;--muted:#a9bfd2;--line:rgba(255,255,255,.13);
}
*{box-sizing:border-box}
html,body{margin:0;background:#061426;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.actions{display:flex;gap:10px;justify-content:center;padding:12px}
.actions button{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer}
.wrap{width:min(100%,1080px);margin:auto;padding:14px}

.poster{
 position:relative;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.10);
 border-radius:30px;
 background:
  radial-gradient(circle at 92% 5%,rgba(22,142,208,.32),transparent 28%),
  radial-gradient(circle at 12% 88%,rgba(168,255,50,.10),transparent 26%),
  linear-gradient(160deg,#061426 0%,#0a233e 56%,#071a2f 100%);
 padding:34px;
 box-shadow:0 28px 70px rgba(0,0,0,.35);
}
.poster:after{
 content:"";position:absolute;right:-180px;bottom:-220px;width:520px;height:520px;
 border:70px solid rgba(168,255,50,.055);border-radius:50%;pointer-events:none
}
.poster>*{position:relative;z-index:1}

.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:18px;padding:6px;flex:none}
.brand b{font-size:18px;letter-spacing:.01em}
.brand span{display:block;margin-top:3px;color:var(--muted);letter-spacing:1.6px;font-size:10px}
.datebadge{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:900;white-space:nowrap}

.hero{margin:54px 0 30px}
.kicker{color:var(--lime);font-weight:1000;letter-spacing:2.4px;font-size:13px;text-transform:uppercase}
.hero h1{font-size:clamp(40px,6.6vw,72px);line-height:.96;margin:12px 0 18px;text-transform:uppercase;letter-spacing:-1.5px;max-width:900px}
.hero p{font-size:18px;line-height:1.45;color:#d0deea;max-width:820px;margin:0}

.info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.info div{min-width:0;background:rgba(255,255,255,.065);border:1px solid var(--line);border-radius:18px;padding:15px}
.info span,.section-label{display:block;color:#91a9bd;text-transform:uppercase;font-size:10px;letter-spacing:1.2px;font-weight:900}
.info b{display:block;font-size:18px;line-height:1.2;margin-top:7px;overflow-wrap:anywhere}

.cta{display:grid;grid-template-columns:1.35fr .95fr;gap:12px;align-items:stretch;margin-bottom:18px}
.cta .main,.cta .contact{border-radius:22px;padding:22px}
.cta .main{background:var(--lime);color:#061426}
.cta .main h2{font-size:30px;line-height:1;margin:0 0 11px}
.cta .main p{font-size:17px;margin:4px 0}
.cta .contact{background:rgba(255,255,255,.075);border:1px solid var(--line)}
.cta .contact b{display:block;font-size:20px;line-height:1.15;margin:8px 0 10px;overflow-wrap:anywhere}
.cta .contact div{color:#d4e0e9;line-height:1.45;overflow-wrap:anywhere}

.partner-section,.visual-section{
 background:rgba(4,19,34,.42);
 border:1px solid var(--line);
 border-radius:22px;
 padding:16px;
 margin-top:12px
}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:12px}
.section-head h3{font-size:17px;margin:3px 0 0}
.section-head small{color:var(--muted)}

.logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.logo{
 min-height:92px;border-radius:15px;background:#fff;padding:10px;
 display:grid;place-items:center;overflow:hidden
}
.logo img{display:block;max-width:100%;max-height:74px;width:auto;height:auto;object-fit:contain}

.visual-section{display:none}
.visual-section.visible{display:block}
.visual-wrap{display:grid;grid-template-columns:minmax(0,280px) 1fr;gap:18px;align-items:center}
.visual-card{background:#fff;border-radius:16px;padding:8px;display:grid;place-items:center;min-height:160px}
.visual-card img{max-width:100%;max-height:330px;object-fit:contain}
.visual-copy h3{font-size:22px;margin:0 0 8px}
.visual-copy p{color:#cbd9e5;line-height:1.45;margin:0}

.footer{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;gap:12px;color:#8ea6ba;font-size:10px}

@media(max-width:760px){
 .actions{display:none}
 .wrap{padding:0}
 .poster{border-radius:0;border:0;padding:20px 16px 24px;box-shadow:none;min-height:100vh}
 .top{align-items:flex-start}
 .brand img{width:52px;height:52px;border-radius:14px}
 .brand b{font-size:15px}
 .brand span{font-size:8px;letter-spacing:1.1px}
 .datebadge{font-size:11px;padding:8px 10px}
 .hero{margin:34px 0 22px}
 .kicker{font-size:10px;letter-spacing:1.5px}
 .hero h1{font-size:clamp(35px,11vw,52px);margin:9px 0 13px}
 .hero p{font-size:15px;line-height:1.4}
 .info{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
 .info div{padding:12px;border-radius:15px}
 .info b{font-size:17px}
 .cta{grid-template-columns:1fr;gap:8px;margin-bottom:10px}
 .cta .main,.cta .contact{border-radius:18px;padding:17px}
 .cta .main h2{font-size:27px}
 .cta .main p{font-size:15px}
 .cta .contact b{font-size:18px}
 .partner-section,.visual-section{border-radius:18px;padding:12px;margin-top:8px}
 .logos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .logo{min-height:82px;padding:8px}
 .logo img{max-height:65px}
 .visual-wrap{grid-template-columns:1fr}
 .visual-card{min-height:0}
 .visual-card img{max-height:300px}
 .visual-copy{display:none}
 .footer{font-size:9px;flex-direction:column;gap:3px}
}

@media(max-width:390px){
 .datebadge{display:none}
 .logos{grid-template-columns:repeat(2,1fr)}
}

@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff}
 .actions{display:none}
 .wrap{padding:0;max-width:none}
 .poster{width:210mm;height:297mm;min-height:297mm;border:0;border-radius:0;box-shadow:none;padding:10mm}
 .hero{margin:18mm 0 8mm}
 .hero h1{font-size:38pt}
 .hero p{font-size:12pt}
 .info{gap:3mm;margin-bottom:4mm}
 .info div{padding:3mm}
 .cta{gap:3mm;margin-bottom:4mm}
 .cta .main,.cta .contact{padding:5mm}
 .partner-section,.visual-section{padding:4mm;margin-top:3mm}
 .logo{min-height:20mm}
 .logo img{max-height:17mm}
 .visual-wrap{grid-template-columns:42mm 1fr}
 .visual-card img{max-height:54mm}
 .footer{font-size:7pt}
}
</style>
</head>
<body>
<div class="actions"><button onclick="window.print()">PDF / Stampa locandina</button></div>
<div class="wrap"><main id="poster" class="poster"><div>Caricamento locandina…</div></main></div>
<script>
const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const token=new URLSearchParams(location.search).get("tournament")||"";

function fmt(d){
 if(!d)return "";
 try{return new Date(d+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}
 catch(_){return d}
}

function classifyPosterAsset(img){
 const card=img.closest(".logo");
 if(!card)return;
 const w=img.naturalWidth||1,h=img.naturalHeight||1;
 if(h/w>1.18){
  const visual=document.getElementById("posterVisual");
  const target=document.getElementById("posterVisualCard");
  if(visual&&target&&!target.querySelector("img")){
   target.appendChild(img);
   card.remove();
   visual.classList.add("visible");
  }
 }
 const grid=document.getElementById("posterLogos");
 const section=document.getElementById("posterPartners");
 if(grid&&section&&!grid.children.length)section.style.display="none";
}

(async()=>{
 const res=await sb.from("tournaments").select("id,name,event_date,club,category,competition_type,data").eq("share_token",token).maybeSingle();
 if(res.error||!res.data){
  document.getElementById("poster").innerHTML="<h1>Locandina non disponibile</h1>";
  return;
 }
 const r=res.data,d=Object.assign({},r.data||{},r);
 const logos=[d.hostClubLogo,d.organizerLogo,d.mainSponsorLogo,d.extraSponsorLogo1,d.extraSponsorLogo2].filter(Boolean);
 const logoHtml=logos.map((x,i)=>'<div class="logo"><img src="'+esc(x)+'" alt="" onload="classifyPosterAsset(this)"></div>').join("");
 const desc=String(d.description||"").trim();
 const comp=String(d.competitionType||d.competition_type||"").replaceAll("_"," ");
 const organizer=String(d.organizerName||"").trim();
 const phone=String(d.organizerPhone||"").trim();
 const email=String(d.organizerEmail||"").trim();

 document.title=(d.name||"Torneo")+" · Locandina";
 document.getElementById("poster").innerHTML=
 '<div class="top"><div class="brand"><img src="assets/padel-arena-manager-logo.png"><div><b>PADEL ARENA MANAGER</b><span>EVENT EXPERIENCE</span></div></div><div class="datebadge">'+esc(fmt(d.event_date||d.date))+'</div></div>'+
 '<section class="hero"><div class="kicker">'+esc(d.category||"PADEL")+(comp?' · '+esc(comp):'')+'</div><h1>'+esc(d.name||"Torneo")+'</h1>'+(desc?'<p>'+esc(desc)+'</p>':'')+'</section>'+
 '<section class="info"><div><span>Data</span><b>'+esc(fmt(d.event_date||d.date))+'</b></div><div><span>Ora</span><b>'+esc(d.startTime||"20:00")+'</b></div><div><span>Club</span><b>'+esc(d.club||"")+'</b></div><div><span>Quota</span><b>€ '+esc(Number(d.entryFee||0))+'</b></div></section>'+
 '<section class="cta"><div class="main"><h2>Partecipa al torneo</h2><p>'+esc(d.registrationMode==="approval"?"Richiesta soggetta ad approvazione":"Iscrizioni aperte")+'</p><p>Posti: '+esc(d.maxParticipants||"—")+'</p></div>'+
 '<div class="contact"><span class="section-label">Organizzatore</span><b>'+esc(organizer||"Padel Arena")+'</b>'+(phone?'<div>'+esc(phone)+'</div>':'')+(email?'<div>'+esc(email)+'</div>':'')+'</div></section>'+
 '<section id="posterPartners" class="partner-section"><div class="section-head"><div><span class="section-label">Club · Ente · Partner</span><h3>In collaborazione con</h3></div><small>Partner ufficiali dell’evento</small></div><div id="posterLogos" class="logos">'+logoHtml+'</div></section>'+
 '<section id="posterVisual" class="visual-section"><div class="visual-wrap"><div id="posterVisualCard" class="visual-card"></div><div class="visual-copy"><span class="section-label">Immagine evento</span><h3>La locandina ufficiale</h3><p>Visual dedicato all’evento, separato dai loghi istituzionali e dagli sponsor.</p></div></div></section>'+
 '<footer class="footer"><span>Padel Arena Manager</span><span>'+esc(d.club||"")+'</span></footer>';
})();
</script>
</body>
</html>

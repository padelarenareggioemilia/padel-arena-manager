<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Iscrizione circuito · Padel Arena Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07111f;--card:#10233b;--line:#294262;--text:#f8fafc;--muted:#a9bacd;--accent:#9dff25}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#123f61,transparent 35%),linear-gradient(180deg,#06101d,#07111f);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:820px;margin:auto;padding:18px 14px 60px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand img{width:66px;height:66px;border-radius:18px}.brand h1{margin:0;font-size:23px}.brand small,.muted{color:var(--muted)}.card{background:rgba(16,35,59,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 16px 44px rgba(0,0,0,.22)}h2{margin:0 0 10px}.notice{padding:12px;border-radius:13px;background:#09182a;border:1px solid var(--line);margin:10px 0}.stage{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.stage:last-child{border-bottom:0}.stage-title{font-size:20px;font-weight:950}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:12px;text-decoration:none;font-weight:950;background:var(--accent);color:#07111f;min-width:180px}.closed{background:#24364d;color:#9fb0c3;pointer-events:none}@media(max-width:650px){.stage{grid-template-columns:1fr}.btn{width:100%}.brand h1{font-size:20px}}</style></head><body><main><div class="brand"><img src="assets/padel-arena-manager-logo.png" alt=""><div><h1>Padel Arena Manager</h1><small>ISCRIZIONE CIRCUITO</small></div></div><div id="app"><section class="card">Caricamento tappe…</section></div></main><script>const SUPABASE_URL="https://zxubwvtngyfebtfnvnwg.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-KVcVuns55FvFMcjRdefxA_KJXUgYBO";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false}});const token=new URLSearchParams(location.search).get("tournament");const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));function fmtDate(v){if(!v)return"Data da definire";const d=new Date(v+"T12:00:00");return d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}async function init(){if(!token){show("Link circuito non valido.");return}const meta=await sb.rpc("public_tournament_for_registration",{p_share_token:token});if(meta.error||!meta.data){show(meta.error?.message||"Circuito non trovato.");return}const stages=await sb.rpc("public_circuit_registration_stages",{p_share_token:token});if(stages.error){show(stages.error.message);return}const t=meta.data,rows=stages.data||[];document.title=(t.name||"Circuito")+" · Iscrizioni";document.getElementById("app").innerHTML='<section class="card"><h2>'+esc(t.name||"Circuito")+'</h2><div class="notice"><b>Scegli la tappa a cui vuoi iscriverti.</b><br><span class="muted">Puoi iscriverti a una, due o tutte le tappe. Dopo ogni iscrizione torna a questa pagina per scegliere la successiva.</span></div></section><section class="card"><h2>Tappe disponibili</h2>'+(rows.length?rows.map(r=>'<div class="stage"><div><div class="stage-title">Tappa '+Number(r.stage_number||0)+(r.category?' · '+esc(r.category):'')+'</div><div class="muted">'+esc(fmtDate(r.stage_date))+(r.stage_start_time?' · '+esc(r.stage_start_time)+(r.stage_end_time?'–'+esc(r.stage_end_time):''):'')+'</div></div>'+(r.registration_open?'<a class="btn" href="public-registration.html?tournament='+encodeURIComponent(r.share_token)+'&circuit='+encodeURIComponent(token)+'">ISCRIVITI</a>':'<span class="btn closed">ISCRIZIONI CHIUSE</span>')+'</div>').join(''):'<div class="muted">Nessuna tappa disponibile.</div>')+'</section>'}function show(msg){document.getElementById("app").innerHTML='<section class="card"><h2>Attenzione</h2><div class="notice">'+esc(msg)+'</div></section>'}init();</script></body></html>
